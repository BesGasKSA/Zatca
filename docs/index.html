<script>
/* Reports centre (across entities) and the annual reconciliation (one entity,
   one year). Both read the headline figures each exercise saves in its summary,
   so they need no recomputation; the WHT beneficiary report loads the year's
   WHT registers on demand. */
(function () {
  'use strict';
  var E = window.ZEngine, S = Z.S, t = Z.t, esc = Z.esc, fmt = Z.fmt;

  // ---------------------------------------------------------------- reports centre
  var VAT_RTABS = [['summary', 'VAT summary'], ['portfolio', 'Portfolio readiness'], ['aging', 'Findings aging'], ['exposure', 'Exposure by entity'], ['corrections', 'Corrections register'], ['calendar', 'Filing compliance']];
  var WHT_RTABS = [['summary', 'WHT summary'], ['beneficiaries', 'WHT by beneficiary'], ['portfolio', 'Portfolio readiness'], ['aging', 'Findings aging'], ['exposure', 'Exposure by entity'], ['calendar', 'Filing compliance']];
  // what belongs to the section on screen
  var W = function () { return Z.isWht(); };
  var mineF = function (f) { return (f.tax === 'WHT') === W(); };
  var sc = function (sm) { return Z.taxScore(sm); };
  var expo = function (sm) { sm = sm || {}; return W() ? sm.whtExposure || 0 : sm.vatExposure != null ? sm.vatExposure : sm.exposure || 0; };
  var fails = function (sm) { sm = sm || {}; return W() ? sm.whtFails || 0 : sm.vatFails != null ? sm.vatFails : sm.fails || 0; };

  // ---- the date range every report follows (months, inclusive)
  function nextMonth(p) { var y = +p.slice(0, 4), m = +p.slice(5) + 1; if (m > 12) { y++; m = 1; } return y + '-' + (m < 10 ? '0' : '') + m; }
  function defaultRange() { var to = E.prevPeriod(E.periodOf(Z.today(), 'monthly')), from = to; for (var i = 0; i < 11; i++) from = E.prevPeriod(from); return { from: from, to: to }; }
  function range() {
    if (!S.rf) { try { S.rf = JSON.parse(localStorage.getItem('zr_rf') || 'null'); } catch (e) {} }
    if (!S.rf || !/^\d{4}-\d{2}$/.test(S.rf.from) || !/^\d{4}-\d{2}$/.test(S.rf.to)) S.rf = defaultRange();
    return S.rf;
  }
  function setRange(from, to) {
    if (from > to) { var x = from; from = to; to = x; }
    S.rf = { from: from, to: to };
    try { localStorage.setItem('zr_rf', JSON.stringify(S.rf)); } catch (e) {}
    Z.route();
  }
  function inRange(period) { var r = E.periodRange(period), R = range(); return !!r && r.end.slice(0, 7) >= R.from && r.start.slice(0, 7) <= R.to; }
  Z.reportAsOf = function () { return asOf(); };
  function asOf() { var end = E.periodRange(range().to).end; return end < Z.today() ? end : Z.today(); }
  function exercisesInRange(e) { return S.exercises.filter(function (x) { return (!e || x.entityId === e.id) && inRange(x.period); }); }
  Z.CHG.rfrom = function (el) { if (el.value) setRange(el.value, range().to); };
  Z.CHG.rto = function (el) { if (el.value) setRange(range().from, el.value); };
  Z.ACT.rquick = function (el) {
    var q = el.dataset.q, y = +Z.today().slice(0, 4), cur = E.periodOf(Z.today(), 'monthly');
    if (q === '12m') { var d = defaultRange(); setRange(d.from, d.to); }

    else if (q === 'all') setRange(Z.FIRST_YEAR + '-01', cur);
    else if (q === 'q') { var qs = Math.floor((+cur.slice(5) - 1) / 3) * 3 + 1, from = y + '-' + (qs < 10 ? '0' : '') + qs; setRange(from, cur); }
  };
  function rangeBar() {
    var R = range(), n = months12().length;
    return '<section class="paper" style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px">' +
      '<label class="f" style="width:170px"><span>' + t('From') + '</span><input type="month" min="' + Z.FIRST_YEAR + '-01" value="' + R.from + '" data-chg="rfrom"></label>' +
      '<label class="f" style="width:170px"><span>' + t('To') + '</span><input type="month" min="' + Z.FIRST_YEAR + '-01" value="' + R.to + '" data-chg="rto"></label>' +
      '<div class="row">' + [['12m', 'Last 12 months'], ['q', 'This quarter'], ['ytd', 'This year'], ['last', 'Last year'], ['all', 'Since 2018']].map(function (b) { return '<button class="btn small" data-act="rquick" data-q="' + b[0] + '">' + t(b[1]) + '</button>'; }).join('') + '</div>' +
      '<p class="faint" style="margin:0;font-size:12.5px;flex-basis:100%">' + n + ' ' + t('months') + ' · ' + t('findings aged as of') + ' ' + Z.ltr(asOf()) + '</p></section>';
  }

  Z.views.reports = function (h) {
    var RTABS = W() ? WHT_RTABS : VAT_RTABS, tab = h[1] || 'summary';

    var nav = '<nav class="tabs" aria-label="' + t('Reports') + '">' + RTABS.map(function (x) { return '<a href="#/reports/' + x[0] + '"' + (tab === x[0] ? ' aria-current="page"' : '') + '>' + t(x[1]) + '</a>'; }).join('') + '</nav>';
    var head = '<div class="pagehead"><div><p class="eyebrow">' + Z.taxName() + '</p><h1>' + (W() ? t('Withholding tax reports') : t('VAT reports')) + '</h1><p>' + t('Across every entity you can see, for the months you choose. Each report exports to Excel.') + '</p></div><button class="btn" data-act="rexport" data-r="' + tab + '">' + Z.icon('microsoft-excel-logo') + ' ' + t('Export to Excel') + '</button></div>';
    if (tab === 'aging' || tab === 'exposure' || tab === 'corrections') {
      return Z.list('findings').then(function (fs) { fs = fs.filter(mineF); S.allFindings = fs; Z.setMain(head + rangeBar() + nav + (tab === 'aging' ? aging(fs) : tab === 'corrections' ? corrections(fs) : exposure(fs))); });
    }

  };

  function findingsInRange(fs) { var ids = {}; exercisesInRange().forEach(function (x) { ids[x.id] = 1; }); return fs.filter(function (f) { return ids[f.parentId]; }); }

  // ---- tax summary: totals per entity over the range
  function summaryRows() {
    return ents().map(function (e) {
      var xs = exercisesInRange(e).filter(function (x) { return x.summary; }), sum = function (k) { return xs.reduce(function (a, x) { return a + (+x.summary[k] || 0); }, 0); };
      var scored = xs.map(function (x) { return sc(x.summary).score; }).filter(function (v) { return v != null; });
      return { e: e, n: xs.length, sales: sum('sales'), outputVat: sum('outputVat'), inputVat: sum('inputVat'), netVat: sum('netVat'), whtTax: sum('whtTax'), whtGross: sum('whtGross'), lateDays: sum('whtLateDays'),
        exposure: xs.reduce(function (a, x) { return a + expo(x.summary); }, 0), fails: xs.reduce(function (a, x) { return a + fails(x.summary); }, 0),

    });
  }
  function summary() {

    return '<section class="paper flush"><div class="tbl-wrap"><table class="t"><thead><tr><th>' + t('Entity') + '</th><th class="num">' + t('Exercises') + '</th><th class="num">' + t('Signed off') + '</th><th class="num">' + t('Sales (box 6)') + '</th><th class="num">' + t('Output VAT') + '</th><th class="num">' + t('Input VAT') + '</th><th class="num">' + t('Net VAT due') + '</th><th class="num">' + t('Failed checks') + '</th><th class="num">' + t('VAT exposure (SAR)') + '</th><th class="num">' + t('Average readiness') + '</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td><a href="#/entity/' + r.e.id + '">' + esc(Z.entName(r.e)) + '</a></td><td class="num">' + r.n + '</td><td class="num">' + r.signed + '</td><td class="num">' + fmt(r.sales) + '</td><td class="num">' + fmt(r.outputVat) + '</td><td class="num">' + fmt(r.inputVat) + '</td><td class="num">' + fmt(r.netVat) + '</td><td class="num">' + r.fails + '</td><td class="num">' + fmt(r.exposure) + '</td><td class="num">' + (r.avg == null ? '-' : r.avg + '%') + '</td></tr>'; }).join('') +

      '<p class="faint" style="font-size:12.5px">' + t('Totals come from each exercise\'s saved figures. An exercise counts when its period overlaps the range; quarterly filers count in full.') + '</p>';
  }
  function whtSummary() {

  };

        '<div>' + Z.icon('calendar-check') + '<b>' + (p.next ? (p.next.daysLeft < 0 ? t('Overdue') : p.next.daysLeft === 0 ? t('Today') : p.next.daysLeft + ' ' + t('days')) : '-') + '</b><span>' + t('To the next deadline') + (p.next ? ' · ' + Z.ltr(p.next.deadline) : '') + '</span></div></div></section>' +

        '<section class="paper reveal span2" style="--i:1"><header><div><h2>' + (wht ? t('WHT returns, last 12 months') : t('VAT returns, last 12 months')) + '</h2><p>' + (wht ? t('Gross paid to non-residents and WHT declared, from each month\'s exercise.') : t('Output and input VAT with the net VAT due, from each month\'s exercise.')) + '</p></div></header>' + returns + '</section>' +
        '<section class="paper reveal" style="--i:2"><header><div><h2>' + t('Readiness over time') + '</h2><p>' + t('Green band: ready for an inspection.') + '</p></div></header>' + trend + '</section>' +

        '<section class="paper reveal span2" style="--i:3"><header><div><h2>' + t('Do the reports agree?') + '</h2><p>' + t('Each line compares two sources an inspector puts side by side. Click one to open its check.') + '</p></div><span class="score-chip">' + mm.agree + ' / ' + mm.known + ' ' + t('agree') + '</span></header><div class="pairs">' + mm.html + '</div></section>' +
        '<section class="paper reveal" style="--i:4"><header><div><h2>' + t('Where the tax is at stake') + '</h2><p>' + t('Open actions by area, each difference counted once.') + '</p></div></header>' + (areaRows.length ? hbars(areaRows) : '<p class="muted">' + t('Nothing at stake.') + '</p>') +
        '<div class="mini"><a href="#/ex/' + S.ex.id + '/findings">' + Z.icon('flag') + ' <b>' + fOpen.length + '</b> ' + t('open findings') + '</a><a href="#/requests">' + Z.icon('envelope-simple') + ' ' + t('ZATCA requests') + '</a><a href="#/reports/' + (wht ? 'beneficiaries' : 'corrections') + '">' + Z.icon('chart-bar') + ' ' + (wht ? t('WHT by beneficiary') : t('Corrections register')) + '</a></div></section>' +

        '<section class="span3 reveal" style="--i:5"><div class="spread" style="margin:6px 0 12px"><div><h2 style="margin:0">' + t('What to do next') + '</h2><p class="muted" style="margin:2px 0 0">' + t('Highest risk first. Each action says how to fix it, by when, and what acting now saves.') + '</p></div><a class="btn" href="#/ex/' + S.ex.id + '/plan">' + Z.icon('list-checks') + ' ' + t('Full action plan') + ' (' + p.open.length + ')</a></div>' +
        (Z.sectionEmpty() ? noDataCard() : top.length ? '<div class="actgrid">' + top.map(function (a, i) { return Z.actionCard(a, i); }).join('') + '</div>' : '<section class="paper empty">' + Z.icon('seal-check') + '<h2>' + t('Every action is done') + '</h2></section>') + '</section>' +
        '</div>');
    });
  };
  Z.CHG.insent = function (el) { S.entityId = el.value; try { localStorage.setItem('zr_entity', el.value); } catch (e) {} location.hash = '#/' + S.tax + '/insights/' + el.value; };

  // ---------------------------------------------------------------- motion: count the headline figures up once they render
  Z.animateCounts = function (root) {
    var els = (root || document.getElementById('main') || document).querySelectorAll('[data-count]');
    if (!els.length || reduced()) return;
    var t0 = performance.now(), dur = 900;
    var targets = [].map.call(els, function (el) { var txt = el.textContent; return { el: el, v: +el.dataset.count || 0, txt: txt, dp: /\.\d\d\)?$/.test(txt.trim()) ? 2 : 0 }; });
    var tick = function (now) {
      var k = Math.min(1, (now - t0) / dur), ease = 1 - Math.pow(1 - k, 3);
      targets.forEach(function (x) { x.el.textContent = k < 1 ? Z.fmt(x.v * ease, x.dp) : x.txt; });
      if (k < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  var setMain = Z.setMain;
  Z.setMain = function (html) { setMain(html); Z.animateCounts(); };
})();

</script>
<script>
/* What sits behind each figure. Every KPI card, readiness bar and "where the
   tax is" bar opens a breakdown drawer listing the parts that make the number,
   largest first, each part linking to where it is fixed.
   Z.autoDrill() recognises the cards by their label, so screens need no
   changes to become drillable. */
(function () {
  'use strict';
  var E = window.ZEngine, S = Z.S, t = Z.t, D = Z.DRILL;
  var isW = function () { return Z.isWht(); };
  var desc = function (a, b) { return (Math.abs(+b.value || 0)) - (Math.abs(+a.value || 0)); };
  var tone = function (g) { return { ready: 'pass', mostly: 'pass', risk: 'warn', not: 'fail' }[g] || ''; };
  var ents = function () { return S.entities.filter(function (e) { return e.active !== false && (!isW() || e.whtRegistered !== false); }); };
  var exsOf = function (e) { return S.exercises.filter(function (x) { return x.entityId === e.id; }).sort(function (a, b) { return a.period < b.period ? 1 : -1; }); };
  var sm = function (x) { return (x && x.summary) || {}; };
  var expo = function (s) { return isW() ? s.whtExposure || 0 : s.vatExposure != null ? s.vatExposure : s.exposure || 0; };
  var fails = function (s) { return isW() ? s.whtFails || 0 : s.vatFails != null ? s.vatFails : s.fails || 0; };
  var TAB = { vat: 'vat', bank: 'bank', einv: 'einv', filing: 'filing', other: 'other', wht: 'wht', analytics: 'analytics', zakat: 'other' };
  var exHref = function (tab) { return S.ex ? '#/ex/' + S.ex.id + '/' + tab : '#/dashboard'; };
  var sec = function () { return Z.taxName(); };

  // ---------------------------------------------------------------- dashboard: across companies
  D.ents = function () {
    var rows = ents().map(function (e) { var x = exsOf(e)[0], s = Z.taxScore(sm(x)); return { label: Z.entName(e), sub: x ? t('Latest exercise') + ' ' + x.period : t('No exercise yet'), value: s.score || 0, display: s.score == null ? '-' : s.score + '%', tone: tone(s.grade), href: '#/insights/' + e.id }; });
    return { title: t('Companies'), sub: sec() + ': ' + t('readiness of the latest exercise'), total: rows.length, totalLabel: t('Companies'), rows: rows.sort(desc) };
  };
  D.open = function () {
    var ids = ents().map(function (e) { return e.id; });
    var rows = S.exercises.filter(function (x) { return x.status !== 'closed' && ids.indexOf(x.entityId) >= 0; }).map(function (x) {
      var s = Z.taxScore(sm(x)); return { label: Z.entName(Z.entity(x.entityId)) + ' ' + x.period, sub: { in_progress: t('In progress'), review: t('Under review') }[x.status] || '', value: s.score || 0, display: s.score == null ? '-' : s.score + '%', tone: tone(s.grade), href: '#/ex/' + x.id + '/overview' };
    });
    return { title: t('Exercises not signed off'), total: rows.length, totalLabel: t('exercises'), rows: rows.sort(desc), empty: t('Every exercise is signed off.') };
  };
  D.avg = function () {
    var rows = ents().map(function (e) {
      var sc = exsOf(e).slice(0, 12).map(function (x) { return Z.taxScore(sm(x)).score; }).filter(function (v) { return v != null; });
      var a = sc.length ? Math.round(sc.reduce(function (p, v) { return p + v; }, 0) / sc.length) : null;
      return { label: Z.entName(e), sub: sc.length + ' ' + t('exercises'), value: a || 0, display: a == null ? '-' : a + '%', tone: a == null ? '' : a >= 85 ? 'pass' : a >= 50 ? 'warn' : 'fail', href: '#/insights/' + e.id };
    });
    return { title: t('Average readiness, last 12 months'), sub: sec(), rows: rows.sort(desc) };
  };
  D.fails = function () {
    var rows = ents().map(function (e) { var x = exsOf(e)[0]; return { label: Z.entName(e), sub: x ? x.period : t('No exercise yet'), value: fails(sm(x)), display: String(fails(sm(x))), tone: 'fail', href: x ? '#/ex/' + x.id + '/plan' : '#/entity/' + e.id }; });
    var tot = rows.reduce(function (a, r) { return a + r.value; }, 0);
    return { title: t('Failed checks in latest exercises'), sub: sec(), total: tot, totalLabel: t('failed checks'), rows: rows.sort(desc) };
  };
  D.expo = function () {
    var rows = ents().map(function (e) { var x = exsOf(e)[0]; return { label: Z.entName(e), sub: x ? x.period : t('No exercise yet'), value: expo(sm(x)), tone: 'fail', href: x ? '#/ex/' + x.id + '/plan' : '#/entity/' + e.id }; });
    return { title: isW() ? t('WHT exposure (SAR)') : t('VAT exposure (SAR)'), sub: t('Latest exercise of each company'), total: rows.reduce(function (a, r) { return a + r.value; }, 0), totalLabel: 'SAR', rows: rows.sort(desc) };
  };

  // ---------------------------------------------------------------- the action plan (Company 360 and the plan tab)
  function plan() { return Z.planFor ? Z.planFor() : { open: [], all: [] }; }
  function actRows(list, field, opt) {
    opt = opt || {};
    return list.map(function (a) {
      var v = field ? +a[field] || 0 : 0;
      return { label: a.checkId + '  ' + Z.tt(a, 'title'), sub: (opt.sub ? opt.sub(a) : t({ critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' }[a.level] || '') + ', ' + t('due') + ' ' + a.deadline) + (a.counted === false ? ', ' + t('same difference as') + ' ' + a.sameAs : ''),
        value: v, display: opt.display ? opt.display(a) : undefined, tone: a.level === 'critical' ? 'fail' : a.level === 'high' ? 'warn' : '', href: exHref(TAB[a.group] || 'plan') };
    });
  }
  var counted = function (k) { return plan().open.filter(function (a) { return a.counted !== false && (+a[k] || 0) > 0; }); };
  D.pimpact = function () { var l = counted('impact'); return { title: t('Tax at stake'), sub: sec() + ': ' + t('each difference counted once'), total: plan().impact, totalLabel: 'SAR', rows: actRows(l, 'impact').sort(desc) }; };
  D.plater = function () { var l = counted('costLater'); return { title: t('Penalties if an inspector finds it'), sub: t('Error fine plus late-payment fines 12 months from now'), total: plan().costLater, totalLabel: 'SAR', rows: actRows(l, 'costLater').sort(desc), note: t('Estimates from the penalty rates in Settings. Not legal advice.') }; };
  D.pnow = function () { var l = counted('costNow'); return { title: t('Penalties if fixed now'), sub: t('What has already accrued'), total: plan().costNow, totalLabel: 'SAR', rows: actRows(l, 'costNow').sort(desc), empty: t('Nothing has accrued yet.') }; };
  D.pavoided = function () { var l = counted('avoided'); return { title: t('Saved by acting now'), sub: t('The fines that keep growing while an error stays open'), total: plan().avoided, totalLabel: 'SAR', rows: actRows(l, 'avoided').sort(desc) }; };
  D.precover = function () { var l = counted('recover'); return { title: t('Tax to reclaim'), total: plan().recover, totalLabel: 'SAR', rows: actRows(l, 'recover').sort(desc) }; };
  D.pcritical = function () { var l = plan().open.filter(function (a) { return a.level === 'critical'; }); return { title: t('Critical actions'), total: l.length, totalLabel: t('actions'), rows: actRows(l, 'impact').sort(desc), empty: t('No critical actions.') }; };
  D.popen = function () {
    var rank = { critical: 0, high: 1, medium: 2, low: 3 }, l = plan().open.slice().sort(function (a, b) { return rank[a.level] - rank[b.level] || b.impact - a.impact; });
    return { title: t('Open actions'), sub: sec(), total: l.length, totalLabel: t('actions'), rows: actRows(l, 'impact') };
  };
  D.pnext = function () {
    var l = plan().open.filter(function (a) { return a.deadline; }).sort(function (a, b) { return a.deadline < b.deadline ? -1 : 1; });
    return { title: t('Deadlines'), sub: t('Soonest first'), money: false, rows: actRows(l, null, { display: function (a) { return a.daysLeft < 0 ? t('Overdue') : a.daysLeft === 0 ? t('Today') : a.daysLeft + ' ' + t('days'); }, sub: function (a) { return a.deadline; } }) };
  };
  D.area = function (label) {
    var l = plan().open.filter(function (a) { return a.counted !== false && a.impact && t(({ vat: 'VAT reconciliation', bank: 'Bank', einv: 'E-invoicing', filing: 'Filing & payment', other: 'Other taxes', wht: 'Withholding tax', analytics: 'Analytics' })[a.group] || a.group) === label; });
    return { title: label, sub: t('Tax at stake by action'), total: l.reduce(function (s, a) { return s + a.impact; }, 0), totalLabel: 'SAR', rows: actRows(l, 'impact').sort(desc) };
  };

  // ---------------------------------------------------------------- one exercise
  function secChecks() {
    var R = S.R; if (!R) return [];
    return isW() ? R.wht.checks.concat(R.filing.checks.filter(function (c) { return c.id === 'C3'; }), R.bank.checks.filter(function (c) { return c.id === 'B5'; }))
      : R.vat.checks.concat(R.bank.checks, R.einv.checks, R.other.checks, R.filing.checks.filter(function (c) { return c.id !== 'C3'; }));
  }
  var checkRow = function (c, v) { return { label: c.id + '  ' + Z.tt(c, 'title'), sub: c.status === 'fail' ? t('Failed') : c.status === 'warn' ? t('Needs explanation') : c.status === 'na' ? t('No data') : t('Passed'), value: v, tone: c.status === 'fail' ? 'fail' : c.status === 'warn' ? 'warn' : 'pass', href: exHref(TAB[c.group] || 'overview') }; };
  D.xexpo = function () { var l = secChecks().filter(function (c) { return c.exposure; }); return { title: isW() ? t('WHT exposure (SAR)') : t('VAT exposure (SAR)'), sub: t('By check'), total: l.reduce(function (s, c) { return s + c.exposure; }, 0), totalLabel: 'SAR', rows: l.map(function (c) { return checkRow(c, c.exposure); }).sort(desc) }; };
  D.xfails = function () {
    var l = secChecks().filter(function (c) { return c.status === 'fail'; });
    return { title: t('Checks failed'), sub: sec(), total: l.length, totalLabel: t('of') + ' ' + secChecks().length, money: false, rows: l.map(function (c) { var r = checkRow(c, Math.abs(c.diff || c.exposure || 0)); r.display = c.diff != null && c.bLabel ? Z.fmt(c.diff) : (c.a != null ? String(c.a) : ''); return r; }).sort(desc) };
  };
  D.xsamples = function () {
    var flows = isW() ? ['W'] : ['S', 'P'], l = (S.samples || []).filter(function (s) { return flows.indexOf(s.flow) >= 0; });
    return { title: t('Samples'), total: l.length, totalLabel: t('samples'), money: false, rows: l.map(function (s) { var ev = s.eval || E.evaluateSample(s, s.confidence); return { label: t({ S: 'Sales invoices', P: 'Purchase invoices', W: 'WHT payments' }[s.flow] || s.flow) + ', ' + t('seed') + ' ' + s.seed, sub: ev.tested + ' / ' + ev.total + ' ' + t('tested'), value: ev.total ? ev.tested / ev.total * 100 : 0, display: ev.rate + '% ' + t('deviation'), tone: ev.deviations ? 'fail' : 'pass', href: exHref('sampling') }; }), empty: t('No samples yet.') };
  };
  D.part = function (k) {
    var R = S.R; if (!R) return null;
    var name = t(Z.partName(k)), groups = { recon: isW() ? ['wht'] : ['vat'], bank: ['bank'], einv: ['einv'], filing: ['filing'], other: ['other'] }[k];
    if (groups) {
      var l = secChecks().filter(function (c) { return groups.indexOf(c.group) >= 0; }).sort(function (a, b) { var o = { fail: 0, warn: 1, na: 2, pass: 3 }; return o[a.status] - o[b.status]; });
      return { title: name, sub: t('Every check in this part'), money: false, rows: l.map(function (c) { var r = checkRow(c, c.status === 'pass' ? 100 : c.status === 'warn' ? 50 : c.status === 'fail' ? 15 : 0); r.display = r.sub; r.sub = c.diff != null && c.bLabel ? t('Difference') + ' ' + Z.fmt(c.diff) : ''; return r; }) };
    }
    if (k === 'analytics') return { title: name, money: false, rows: R.analytics.tests.filter(function (x) { return x.status !== 'pass'; }).map(function (x) { return { label: x.id + '  ' + Z.tt(x, 'title'), sub: x.count + ' ' + t('items'), value: x.count, display: String(x.count), tone: x.status === 'fail' ? 'fail' : 'warn', href: exHref('analytics') }; }).sort(desc), empty: t('No exceptions.') };
    if (k === 'checklist') { var cl = (S.checklist && S.checklist.items || []).filter(function (x) { return (x.area === 'WHT') === isW() && x.status !== 'na'; }); return { title: name, total: cl.filter(function (x) { return x.status === 'available'; }).length, totalLabel: t('of') + ' ' + cl.length + ' ' + t('on file'), money: false, rows: cl.map(function (x) { return { label: S.lang === 'ar' ? x.ar : x.en, sub: x.owner || '', value: x.status === 'available' ? 100 : x.status === 'requested' ? 50 : 10, display: t({ available: 'On file', requested: 'Requested', missing: 'Missing' }[x.status] || x.status), tone: x.status === 'available' ? 'pass' : x.status === 'requested' ? 'warn' : 'fail', href: exHref('checklist') }; }) }; }
    if (k === 'findings') return D.fopen();
    if (k === 'sampling') return D.xsamples();
    return null;
  };
  var findings = function () { return (S.findings || []).filter(function (f) { return (f.tax === 'WHT') === isW(); }); };
  var fRow = function (f, v) { return { label: f.title, sub: t(Z.cap(f.severity)) + (f.owner ? ', ' + f.owner : '') + (f.due ? ', ' + t('due') + ' ' + f.due : ''), value: v, tone: f.severity === 'critical' || f.severity === 'high' ? 'fail' : 'warn', href: exHref('findings') }; };
  D.fopen = function () { var l = findings().filter(function (f) { return f.status !== 'closed'; }); return { title: t('Open findings'), total: l.length, totalLabel: t('findings'), rows: l.map(function (f) { return fRow(f, +f.taxImpact || 0); }).sort(desc), empty: t('No open findings.') }; };
  D.ftax = function () { var l = findings().filter(function (f) { return f.status !== 'closed'; }); return { title: t('Tax at stake'), sub: t('Open findings'), total: l.reduce(function (s, f) { return s + (+f.taxImpact || 0); }, 0), totalLabel: 'SAR', rows: l.map(function (f) { return fRow(f, +f.taxImpact || 0); }).sort(desc) }; };
  D.fpen = function () { var l = findings().filter(function (f) { return f.status !== 'closed'; }); return { title: t('Estimated penalties'), total: l.reduce(function (s, f) { return s + (+f.penalty || 0); }, 0), totalLabel: 'SAR', rows: l.map(function (f) { return fRow(f, +f.penalty || 0); }).sort(desc) }; };

  // ---------------------------------------------------------------- e-invoicing
  var invRow = function (x, why) { return { label: x.invoice, sub: [x.date, x.party || x.buyerVat, why || x.message || ''].filter(Boolean).join(', '), value: Math.abs(+x.vat || 0), display: Z.fmt(+x.vat || 0), href: exHref('einv') }; };
  D.einvsrc = function (k) {
    var d = S.data || {}, l = k === 'erp' ? (d.sys_vat || []).filter(function (x) { return x.flow === 'S'; }) : k === 'provider' ? d.einv_provider || [] : d.einv || [];
    return { title: { erp: t('Sales documents in the ERP'), provider: t('Received by the e-invoicing provider'), zatca: t('Held by ZATCA (Fatoora export)') }[k], sub: t('Largest VAT first, up to 200'), total: l.length, totalLabel: t('documents'), money: false, rows: l.slice().sort(function (a, b) { return Math.abs(+b.vat || 0) - Math.abs(+a.vat || 0); }).slice(0, 200).map(function (x) { return invRow(x); }) };
  };
  D.einvstatus = function (st) {
    var l = ((S.data || {}).einv_provider || []).filter(function (x) { return (x.status || '-') === st; });
    return { title: t('Status') + ': ' + st, total: l.length, totalLabel: t('documents'), money: false, rows: l.slice(0, 200).map(function (x) { return invRow(x); }) };
  };

  // ---------------------------------------------------------------- reports and users
  D.age = function (bucket) {
    var asOf = Z.reportAsOf ? Z.reportAsOf() : Z.today(), b = E.aging(S.allFindings || [], asOf), l = b[bucket] || [];
    return { title: t('Findings aging'), sub: t('As of') + ' ' + asOf, total: l.length, totalLabel: t('findings'), rows: l.map(function (f) { var x = S.exercises.filter(function (e) { return e.id === f.parentId; })[0]; return { label: f.title, sub: (x ? Z.entName(Z.entity(x.entityId)) + ' ' + x.period : '') + (f.owner ? ', ' + f.owner : ''), value: +f.taxImpact || 0, tone: 'fail', href: '#/ex/' + f.parentId + '/findings' }; }).sort(desc), empty: t('No findings in this group.') };
  };
  D.corr = function (state) {
    var rows = E.corrections(S.allFindings || [], S.settingsDoc ? S.settingsDoc.values : {}, Z.today()).filter(function (r) { return r.state === state; });
    return { title: t('Corrections register'), total: rows.length, totalLabel: t('corrections'), rows: rows.map(function (r) { return { label: r.title, sub: t('due') + ' ' + r.dueBy + (r.daysLeft != null && r.state !== 'done' ? ', ' + r.daysLeft + ' ' + t('days') : ''), value: +r.taxImpact || 0, tone: state === 'overdue' ? 'fail' : state === 'done' ? 'pass' : 'warn', href: '#/ex/' + r.parentId + '/findings' }; }).sort(desc) };
  };
  D.benef = function (k) {
    var l = (S.benef || []).filter(function (b) { return k !== 'nocert' || b.missingCert; });
    var f = k === 'wht' ? 'wht' : 'gross';
    return { title: { all: t('Beneficiaries'), gross: t('Paid to non-residents'), wht: t('WHT withheld'), nocert: t('Payments without a certificate') }[k], total: k === 'nocert' ? l.reduce(function (s, b) { return s + b.missingCert; }, 0) : k === 'all' ? l.length : l.reduce(function (s, b) { return s + b[f]; }, 0), totalLabel: k === 'nocert' ? t('payments') : k === 'all' ? t('beneficiaries') : 'SAR',
      rows: l.map(function (b) { return { label: b.party, sub: [b.country, Z.entName(Z.entity(b.entityId))].filter(Boolean).join(', '), value: k === 'nocert' ? b.missingCert : b[f], display: k === 'nocert' ? String(b.missingCert) : undefined, tone: k === 'nocert' ? 'fail' : '' }; }).sort(desc) };
  };
  D.users = function (k) {
    var l = (S.users || []).filter(function (u) { return u.active !== false; });
    var all = function (u) { return u.role === 'owner' || (u.entityIds || []).indexOf('*') >= 0; };
    if (k === 'signoff') l = l.filter(function (u) { return u.role === 'owner' || u.role === 'manager'; });
    if (k === 'none') l = l.filter(function (u) { return !all(u) && !(u.entityIds || []).length; });
    if (k === 'companies') return { title: t('Companies'), money: false, rows: S.entities.map(function (e) { var n = l.filter(function (u) { return all(u) || (u.entityIds || []).indexOf(e.id) >= 0; }).length; return { label: Z.entName(e), sub: n + ' ' + t('people'), value: n, display: String(n), href: '#/users' }; }).sort(desc) };
    return { title: { active: t('Active users'), signoff: t('Can sign off'), none: t('Without any company') }[k], total: l.length, totalLabel: t('people'), money: false, rows: l.map(function (u) { var n = all(u) ? S.entities.length : (u.entityIds || []).length; return { label: Z.userLabel ? Z.userLabel(u) : u.name, sub: t(Z.cap(u.role)) + ', ' + u.email, value: n, display: all(u) ? t('All companies') : n + ' ' + t('companies'), href: '#/users' }; }).sort(desc) };
  };

  // ---------------------------------------------------------------- recognise cards by their label
  var view = function () { return (S.route || [])[0] || 'dashboard'; }, tab = function () { return (S.route || [])[2] || 'overview'; };

    ['Entities', function () { return view() === 'dashboard' ? 'ents' : null; }],
    ['Exercises not signed off', 'open'], ['Average readiness, last 12 months', 'avg'], ['Failed checks in latest exercises', 'fails'],
    ['VAT exposure (SAR)', function () { return view() === 'dashboard' ? 'expo' : 'xexpo'; }], ['WHT exposure (SAR)', function () { return view() === 'dashboard' ? 'expo' : 'xexpo'; }],
    ['Tax at stake (SAR)', function () { return view() === 'ex' && tab() === 'findings' ? 'ftax' : 'pimpact'; }],
    ['Penalties if left to an inspector (SAR)', 'plater'], ['If found at inspection (SAR)', 'plater'], ['Penalties if fixed now (SAR)', 'pnow'],
    ['Saved by acting now (SAR)', 'pavoided'], ['Tax to reclaim (SAR)', 'precover'], ['Critical actions', 'pcritical'], ['Open actions', 'popen'], ['To the next deadline', 'pnext'],
    ['Checks failed', 'xfails'], ['Samples', 'xsamples'], ['Open findings', 'fopen'], ['Estimated penalties (SAR)', 'fpen'],
    ['Sales documents in the ERP', 'einvsrc:erp'], ['Received by the e-invoicing provider', 'einvsrc:provider'], ['Held by ZATCA (Fatoora export)', 'einvsrc:zatca'],
    ['Over 90 days overdue', 'age:over90'], ['61-90 days overdue', 'age:d90'], ['31-60 days overdue', 'age:d60'], ['1-30 days overdue', 'age:d30'], ['Not yet due', 'age:notDue'], ['No due date', 'age:noDate'],
    ['Overdue corrections', 'corr:overdue'], ['Open, still in time', 'corr:open'], ['Corrected', 'corr:done'],
    ['Beneficiaries', 'benef:all'], ['Paid to non-residents', function () { return view() === 'reports' ? 'benef:gross' : null; }], ['WHT withheld', 'benef:wht'], ['Payments without a certificate', 'benef:nocert'],
    ['Active users', 'users:active'], ['Companies', function () { return view() === 'users' ? 'users:companies' : null; }], ['Can sign off', 'users:signoff'], ['Without any company', 'users:none']
  ];
  var EST = { 'Cleared by ZATCA': 'CLEARED', 'Reported to ZATCA': 'REPORTED', 'Rejected': 'REJECTED', 'Pending at provider': 'PENDING', 'Accepted with warnings': 'WARNING', 'Not sent': 'NOT_SUBMITTED' };
  Z.autoDrill = function () {
    var main = document.getElementById('main'); if (!main) return;
    main.querySelectorAll('.kpis > div:not([data-drill])').forEach(function (tile) {
      var sp = tile.querySelector(':scope > span'); if (!sp) return;
      var label = sp.textContent.trim(), key = null;
      RULES.some(function (r) { var en = t(r[0]); if (label === en || label.indexOf(en + ',') === 0) { key = typeof r[1] === 'function' ? r[1]() : r[1]; return true; } return false; });
      if (!key) Object.keys(EST).some(function (en) { if (label === t(en)) { key = 'einvstatus:' + EST[en]; return true; } return false; });
      if (!key && view() === 'ex' && tab() === 'einv' && /^[A-Z_]+$/.test(label)) key = 'einvstatus:' + label;
      if (key) tile.setAttribute('data-drill', key);
    });
    main.querySelectorAll('.parts .p:not([data-drill])').forEach(function (p) {
      var label = (p.querySelector('span') || {}).textContent;
      ['recon', 'bank', 'einv', 'filing', 'other', 'analytics', 'sampling', 'checklist', 'findings'].some(function (k) { if (t(Z.partName(k)) === label) { p.setAttribute('data-drill', 'part:' + k); return true; } return false; });
    });
    main.querySelectorAll('.hbars .hb:not([data-drill])').forEach(function (h) { var label = (h.querySelector('span') || {}).textContent; if (label && view() === 'insights') h.setAttribute('data-drill', 'area:' + label); });
  };
  new MutationObserver(function () { Z.autoDrill(); }).observe(document.documentElement, { childList: true, subtree: true });

})();

<script>
/* The ZATCA side of the relationship: the statement of account ZATCA keeps for
   the company, refund applications, disputes and penalties, one tax calendar
   across every tax and company, and reviewer notes that hold sign-off.
   All arithmetic is in the engine (E.statementRecon, E.refundStatus,
   E.disputeStatus, E.complianceCalendar, E.ics); this file lays it out. */
(function () {
  'use strict';
  var E = window.ZEngine, S = Z.S, t = Z.t, esc = Z.esc, fmt = Z.fmt, D = Z.DRILL;
  var cfg = function () { return S.settingsDoc ? S.settingsDoc.values : {}; };

  var entName = function (id) { return Z.entName(Z.entity(id)) || '-'; };
  var sel = function (name, cur, opts, attrs) { return '<select name="' + name + '"' + (attrs || '') + '>' + opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(cur == null ? '' : cur) === String(o[0]) ? ' selected' : '') + '>' + esc(t(o[1])) + '</option>'; }).join('') + '</select>'; };
  var selF = function (name, label, cur, opts) { return '<label class="f"><span>' + esc(label) + '</span>' + sel(name, cur, opts) + '</label>'; };
  var entOpts = function () { return S.entities.map(function (e) { return [e.id, Z.entName(e)]; }); };
  var kpi = function (icon, val, label, drill, tone) { return '<div class="' + (tone || '') + '"' + (drill ? ' data-drill="' + drill + '"' : '') + '>' + Z.icon(icon) + '<b>' + val + '</b><span>' + esc(label) + '</span></div>'; };
  var head = function (eyebrow, title, text, right) { return '<div class="pagehead"><div><p class="eyebrow">' + Z.icon('bank') + ' ' + esc(eyebrow) + '</p><h1>' + esc(title) + '</h1><p>' + esc(text) + '</p></div>' + (right ? '<div class="row">' + right + '</div>' : '') + '</div>'; };
  var TAXN = { VAT: 'VAT', WHT: 'WHT', ZAKAT: 'Zakat', EXCISE: 'Excise', RETT: 'RETT', CIT: 'Income tax', ZATCA: 'ZATCA letter', OTHER: 'Other' };
  var taxName = function (k) { return t(TAXN[k] || k); };
  var KINDN = { return: 'Return', payment: 'Payment', penalty: 'Penalty', refund: 'Refund', assessment: 'Assessment', adjustment: 'Adjustment' };
  // a deadline as a chip: overdue, within a week, later, waiting on ZATCA, done
  function dueChip(state, days, due) {
    if (state === 'done' || state === 'closed') return '<span class="zk-due ok">' + Z.icon('check') + t('Done') + '</span>';
    if (!due) return '';
    if (state === 'waiting' || state === 'chase') return '<span class="zk-due wait" title="' + esc(due) + '">' + Z.icon('hourglass-medium') + (days < 0 ? t('ZATCA is past its date by') + ' ' + -days + ' ' + t('days') : t('ZATCA, by') + ' ' + esc(due)) + '</span>';
    if (days < 0) return '<span class="zk-due bad">' + Z.icon('warning') + t('Overdue by') + ' ' + -days + ' ' + t('days') + '</span>';
    if (days === 0) return '<span class="zk-due bad">' + Z.icon('alarm') + t('Due today') + '</span>';
    return '<span class="zk-due' + (days <= 7 ? ' soon' : '') + '">' + Z.icon('calendar-blank') + t('In') + ' ' + days + ' ' + t('days') + ', ' + Z.ltr(due) + '</span>';
  }
  function steps(list, idx, closed) {
    return '<ol class="zk-steps" aria-label="' + esc(t('Progress')) + '">' + list.map(function (s, i) {
      var st = closed || i < idx ? 'done' : i === idx ? 'cur' : '';
      return '<li class="' + st + '"' + (i === idx && !closed ? ' aria-current="step"' : '') + '><i aria-hidden="true"></i><span>' + esc(t(s)) + '</span></li>';
    }).join('') + '</ol>';
  }
  function download(name, text, type) {
    var b = new Blob([text], { type: type }), a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function chk(c) {
    var figs = c.status === 'na' ? '<span>' + t('Needs') + ': <b>' + esc(t(c.missing || '')) + '</b>' + (c.missingHint ? ' - ' + esc(t(c.missingHint)) : '') + '</span>' :
      (c.aLabel ? '<span>' + esc(t(c.aLabel)) + ': <b>' + fmt(c.a, /Returns|Periods/.test(c.aLabel) ? 0 : 2) + '</b></span>' : '') + (c.bLabel ? '<span>' + esc(t(c.bLabel)) + ': <b>' + fmt(c.b) + '</b></span>' : '') +
      (c.diff != null ? '<span class="d ' + c.status + '">' + t('Difference') + ': <b>' + fmt(c.diff) + '</b></span>' : '') + (c.exposure ? '<span class="d fail">' + t('Exposure') + ': <b>' + fmt(c.exposure) + '</b></span>' : '');
    var list = (c.exceptions && c.exceptions.list) || [];
    return '<div class="check" id="c-' + c.id + '">' + Z.tick(c.status) + '<div><h3>' + esc(c.id) + ' · ' + esc(ar() ? c.titleAr : c.title) + '</h3><div class="figs">' + figs + '</div>' +
      (c.note ? '<p class="faint" style="font-size:12.5px;margin:4px 0 0">' + esc(ar() && c.noteAr ? c.noteAr : t(c.note)) + '</p>' : '') +
      (list.length ? '<details><summary>' + t('Show the items') + ' (' + list.length + ')</summary>' + Z.rowsTable(list) + '</details>' : '') + '</div><div class="acts"></div></div>';
  }

  // ================================================================ statement of account
  var SOA = { doc: null, rec: null, e: null };
  Z.views.account = function (h) {
    var e = Z.entity(h[1]) || Z.entity(S.entityId) || S.entities[0];
    if (!e) return Z.setMain(head(t('ZATCA account'), t('Statement of account'), t('Add an entity first.')));
    return Promise.all([Z.get('statements', e.id + '_soa'), Z.list('disputes')]).then(function (r) {
      SOA.e = e; SOA.doc = r[0] || { id: e.id + '_soa', entityId: e.id, lines: [], label: 'ZATCA statement of account' }; SOA.doc.lines = SOA.doc.lines || []; SOA.disputes = r[1];
      renderSoa();
    });
  };
  function renderSoa() {
    var e = SOA.e, doc = SOA.doc, can = Z.can('preparer');
    var rec = SOA.rec = E.statementRecon(doc, S.exercises.filter(function (x) { return x.entityId === e.id; }), SOA.disputes.filter(function (d) { return d.entityId === e.id; }), cfg(), Z.today());
    var sa = function (id) { return rec.checks.filter(function (c) { return c.id === id; })[0]; };
    var gl = doc.glBalance == null || doc.glBalance === '' ? null : +doc.glBalance;
    var right = (S.entities.length > 1 ? '<label class="f inline"><span class="sr-only">' + t('Entity') + '</span>' + sel('soaent', e.id, entOpts(), ' data-chg="soaent" aria-label="' + esc(t('Entity')) + '"') + '</label>' : '') +
      (can ? '<button class="btn" data-act="soaimport">' + Z.icon('upload-simple') + ' ' + t('Import statement') + '</button><button class="btn primary" data-act="soaline">' + Z.icon('plus') + ' ' + t('Add line') + '</button>' : '');
    var taxes = Object.keys(rec.byTax);
    var hero = '<section class="paper zk-hero"><div class="zk-bal"><span class="zk-k">' + (rec.balance >= 0 ? t('Owed to ZATCA') : t('ZATCA owes you')) + '</span><b class="num" data-count="' + Math.abs(rec.balance) + '">' + fmt(Math.abs(rec.balance)) + '</b><span class="faint">SAR' + (rec.asOf ? ', ' + t('as of') + ' ' + Z.ltr(rec.asOf) : '') + '</span>' +
      (taxes.length ? '<div class="zk-chips">' + taxes.map(function (k) { return '<span class="zk-chip"><i class="tx tx-' + k.toLowerCase() + '"></i>' + esc(taxName(k)) + ' <b class="num">' + fmt(rec.byTax[k].balance) + '</b></span>'; }).join('') + '</div>' : '') +
      '<div class="zk-gl"><label class="f"><span>' + t('Balance per general ledger') + '</span><input type="number" step="0.01" data-chg="soagl" value="' + (gl == null ? '' : gl) + '"' + (can ? '' : ' disabled') + ' placeholder="' + esc(t('Net of all ZATCA accounts')) + '"></label>' +
      '<label class="f"><span>' + t('Statement date') + '</span><input type="date" data-chg="soaasof" value="' + esc(doc.asOf || '') + '"' + (can ? '' : ' disabled') + '></label></div></div>' +
      '<div class="zk-run">' + runChart(rec.lines) + '</div></section>';
    var kp = '<div class="kpis">' + kpi('scales', fmt(rec.balance), t('Balance per ZATCA statement'), 'soa:tax') + kpi('book-open', gl == null ? '-' : fmt(gl), t('Balance per general ledger'), null) +
      kpi('gavel', fmt(rec.penalties), t('Penalties on the statement'), 'soa:pen', sa('SA3').status === 'fail' ? 'bad' : '') + kpi('alarm', fmt(rec.overdue), t('Unpaid after the due date'), 'soa:over', rec.overdue ? 'bad' : '') +
      kpi('shield-warning', fmt(rec.exposure), t('Exposure (SAR)'), 'soa:expo', rec.exposure ? 'bad' : '') + '</div>';
    var checks = '<section class="paper"><header><div><h2>' + t('What the statement says about your filings') + '</h2><p>' + t('ZATCA keeps its own ledger for the company. Inspectors start from it: every return, assessment, penalty and payment should agree with your books.') + '</p></div>' +
      '<span class="score-chip">' + rec.checks.filter(function (c) { return c.status === 'pass'; }).length + ' / ' + rec.checks.filter(function (c) { return c.status !== 'na'; }).length + ' ' + t('agree') + '</span></header>' + rec.checks.map(chk).join('') + '</section>';
    var pr = rec.periods.slice().reverse().slice(0, 18);
    var cell = function (ret, soa) { var d = ret != null && soa != null ? soa - ret : null; return '<td class="num">' + fmt(soa) + (d && Math.abs(d) > 1 ? ' <span class="diff-bad">(' + (d > 0 ? '+' : '') + fmt(d) + ')</span>' : '') + '</td>'; };
    var periods = pr.length ? '<section class="paper flush"><div style="padding:14px 18px"><h2>' + t('Period by period') + '</h2><p class="muted" style="margin:2px 0 0">' + t('Your return, what ZATCA posted, and what was paid.') + '</p></div><div class="tbl-wrap"><table class="t zk-tbl"><thead><tr><th>' + t('Period') + '</th><th class="num">' + t('VAT return') + '</th><th class="num">' + t('VAT on the statement') + '</th><th class="num">' + t('VAT paid') + '</th><th class="num">' + t('WHT return') + '</th><th class="num">' + t('WHT on the statement') + '</th><th class="num">' + t('WHT paid') + '</th></tr></thead><tbody>' +
      pr.map(function (p) { return '<tr class="clickable" data-act="openex" data-id="' + p.exId + '"><td>' + Z.ltr(p.period) + '</td><td class="num">' + fmt(p.vatReturn) + '</td>' + cell(p.vatReturn, p.vatSoa) + '<td class="num">' + fmt(p.vatPaid || null) + '</td><td class="num">' + fmt(p.whtReturn) + '</td>' + cell(p.whtReturn, p.whtSoa) + '<td class="num">' + fmt(p.whtPaid || null) + '</td></tr>'; }).join('') + '</tbody></table></div></section>' : '';
    var run = 0, sorted = rec.lines.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.i - b.i; });
    var lines = '<section class="paper flush"><div class="spread" style="padding:14px 18px"><div><h2>' + t('Statement lines') + '</h2><p class="muted" style="margin:2px 0 0">' + rec.lines.length + ' ' + t('lines') + (rec.first ? ', ' + Z.ltr(rec.first) + ' - ' + Z.ltr(rec.last) : '') + '</p></div>' +
      (can && rec.lines.length ? '<button class="btn small ghost" data-act="soaclear">' + Z.icon('trash') + ' ' + t('Clear the statement') + '</button>' : '') + '</div>' +
      (rec.lines.length ? '<div class="tbl-wrap" style="max-height:560px"><table class="t zk-tbl"><thead><tr><th>' + t('Date') + '</th><th>' + t('Tax') + '</th><th>' + t('Type') + '</th><th>' + t('Period') + '</th><th>' + t('Description') + '</th><th>' + t('Reference') + '</th><th class="num">' + t('Debit') + '</th><th class="num">' + t('Credit') + '</th><th class="num">' + t('Balance') + '</th>' + (can ? '<th><span class="sr-only">' + t('Remove') + '</span></th>' : '') + '</tr></thead><tbody>' +
        sorted.map(function (l) { run += l.debit - l.credit; return '<tr class="k-' + l.kind + '"><td class="nowrap">' + Z.ltr(l.date) + '</td><td><span class="zk-tx"><i class="tx tx-' + l.taxType.toLowerCase() + '"></i>' + esc(taxName(l.taxType)) + '</span></td><td>' + (l.kind === 'penalty' ? Z.pill('fail', t('Penalty')) : esc(t(KINDN[l.kind]))) + '</td><td>' + Z.ltr(l.period) + '</td><td>' + esc(l.description) + '</td><td>' + Z.ltr(l.reference) + '</td><td class="num">' + (l.debit ? fmt(l.debit) : '') + '</td><td class="num">' + (l.credit ? fmt(l.credit) : '') + '</td><td class="num">' + fmt(run) + '</td>' +
          (can ? '<td><button class="btn ghost small icon" data-act="soadel" data-i="' + l.i + '" aria-label="' + esc(t('Remove') + ' ' + l.date + ' ' + l.description) + '">' + Z.icon('x') + '</button></td>' : '') + '</tr>'; }).join('') + '</tbody></table></div>' :
        '<div class="empty"><i class="ph ph-file-arrow-down big" aria-hidden="true"></i><h2>' + t('No statement loaded yet') + '</h2><p>' + t('Download the statement of account from the ZATCA portal (Excel), then import it here. Columns are recognised in English or Arabic.') + '</p>' + (can ? '<button class="btn primary" data-act="soaimport">' + t('Import statement') + '</button>' : '') + '</div>') + '</section>';
    Z.setMain(head(t('ZATCA account'), t('Statement of account') + ': ' + Z.entName(e), t('Reconcile what ZATCA has posted for the company with your returns, payments and general ledger.'), right) +
      '<div class="stack">' + hero + kp + checks + periods + lines + '</div>');
  }
  // balance at each month end: returns and their payments cross within days, so
  // daily points swing; month ends show what is really building up
  function runChart(lines) {
    var L = lines.slice().filter(function (l) { return l.date; }).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.i - b.i; });
    var months = [], b = 0;
    L.forEach(function (l) {
      b += l.debit - l.credit; var mk = l.date.slice(0, 7), last = months[months.length - 1];
      if (!last || last.m !== mk) months.push(last = { m: mk, v: 0, pen: 0, items: [] });
      last.v = b; if (l.kind === 'penalty' && l.debit) { last.pen += l.debit; last.items.push(l); }
    });
    if (months.length < 2) return '<div class="zk-run-empty faint">' + t('The balance over time appears once the statement covers two months.') + '</div>';
    var W = 560, H = 200, pl = 10, pr = 10, pt = 22, pb = 30, n = months.length;
    var lo = Math.min(0, Math.min.apply(null, months.map(function (p) { return p.v; }))), hi = Math.max(1, Math.max.apply(null, months.map(function (p) { return p.v; })));
    var x = function (i) { return pl + 18 + i * (W - pl - pr - 36) / (n - 1); }, y = function (v) { return pt + (hi - v) / (hi - lo || 1) * (H - pt - pb); };
    var d = months.map(function (p, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    var area = d + ' L' + x(n - 1).toFixed(1) + ' ' + y(0).toFixed(1) + ' L' + x(0).toFixed(1) + ' ' + y(0).toFixed(1) + ' Z';
    var lab = function (mk) { return new Date(Date.UTC(+mk.slice(0, 4), +mk.slice(5, 7) - 1, 1)).toLocaleDateString(ar() ? 'ar-SA-u-ca-gregory-nu-latn' : 'en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' }); };
    var dots = months.map(function (p, i) {
      return '<circle class="' + (p.pen ? 'pen' : 'dot') + '" style="--i:' + i + '" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (p.pen ? 6 : 4) + '"><title>' + esc(p.m + ': ' + fmt(p.v) + (p.pen ? ', ' + t('Penalty posted') + ' ' + fmt(p.pen) : '')) + '</title></circle>' +
        '<text class="ax" x="' + x(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(lab(p.m)) + '</text>' +
        (i === n - 1 || p.pen ? '<text class="vl" x="' + x(i).toFixed(1) + '" y="' + (y(p.v) - 11).toFixed(1) + '" text-anchor="middle">' + fmt(p.v) + '</text>' : '');
    }).join('');
    return '<div class="chart"><svg direction="ltr" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(t('Balance with ZATCA over time')) + '">' +
      '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '"/>' +
      '<path class="area" d="' + area + '"/><path class="ln draw" d="' + d + '"/>' + dots + '</svg>' +
      '<p class="zk-legend"><span><i class="k-ln"></i>' + t('Balance owed to ZATCA at month end') + '</span><span><i class="k-pen"></i>' + t('Penalty posted') + '</span></p></div>';
  }
  function saveSoa(msg) { return Z.save('statements', SOA.doc).then(function (d) { SOA.doc = d; d.lines = d.lines || []; renderSoa(); if (msg) Z.toast(msg); }); }
  Z.CHG.soaent = function (el) { location.hash = '#/' + S.tax + '/account/' + el.value; };
  Z.CHG.soagl = function (el) { SOA.doc.glBalance = el.value === '' ? null : +el.value; saveSoa(); };
  Z.CHG.soaasof = function (el) { SOA.doc.asOf = el.value; saveSoa(); };
  Z.ACT.soadel = function (el) {
    // data-i is the line's place in the stored list (E.soaLines keeps it)
    SOA.doc.lines.splice(+el.dataset.i, 1); saveSoa(t('Line removed'));
  };
  Z.ACT.soaclear = function () { if (!confirm(t('Remove every line of this statement?'))) return; SOA.doc.lines = []; saveSoa(t('Statement cleared')); };
  Z.ACT.soaline = function () {
    Z.modal(t('Add a statement line'), '<form id="sf" class="grid g2">' + Z.fld('date', t('Date'), Z.today(), 'date', 'required') +
      selF('taxType', t('Tax'), 'VAT', [['VAT', 'VAT'], ['WHT', 'WHT'], ['ZAKAT', 'Zakat'], ['EXCISE', 'Excise'], ['RETT', 'RETT'], ['CIT', 'Income tax']]) +
      selF('kind', t('Type'), 'return', Object.keys(KINDN).map(function (k) { return [k, KINDN[k]]; })) + Z.fld('period', t('Period'), '', 'text', 'placeholder="2026-09"') +
      Z.fld('debit', t('Debit (owed to ZATCA)'), '', 'number', 'step="0.01" min="0"') + Z.fld('credit', t('Credit (paid or refunded)'), '', 'number', 'step="0.01" min="0"') +
      Z.fld('reference', t('Reference'), '', 'text') + Z.fld('description', t('Description'), '', 'text') + '</form>',
      '<button class="btn" data-act="closemodal">' + t('Cancel') + '</button><button class="btn primary" data-act="soalinesave">' + t('Add line') + '</button>');

  function render() {

      }).join('') + '<p class="zk-legend"><span><i class="k-rec"></i>' + t('To reclaim') + '</span><span><i class="k-pen"></i>' + t('To pay') + '</span></p></div></section>';

      '<div class="stack"><div class="kpis">' + kpi('arrow-fat-line-up', fmt(res.exposure), t('VAT to pay (SAR)'), 'adj:due', res.exposure ? 'bad' : '') + kpi('arrow-u-up-left', fmt(res.recover), t('VAT to reclaim (SAR)'), 'adj:rec', res.recover ? 'good' : '') +

      chart + sections + '</div>');

  function section(k, c, list, can) {

  function colHead(k) {

      (s.issues.length ? '<div>' + s.issues.map(function (x) { return Z.pill('fail', t(AISS[x])); }).join(' ') + '</div>' : '') + '</td>' + num(s.due, s.due ? 'diff-bad' : '') + '</tr>';
    if (k === 'fx') return '<tr' + open + '>' + who(it.invoice, it.party) + '<td>' + esc(String(it.currency || '').toUpperCase()) + ' ' + fmt(it.amount) + '</td><td class="num">' + fmt(it.rateUsed, 4) + '</td><td class="num">' + fmt(s.sama, 4) + '</td>' + num(s.diffSar) + num(s.vatDiff, s.status === 'fail' ? 'diff-bad' : '') + '</tr>';
    return '<tr' + open + '>' + who(it.party, it.relation) + '<td>' + esc(it.description || '') + '</td>' + num(it.consideration) + num(it.marketValue) + '<td>' + (it.buyerFullRecovery === true ? t('Yes') : t('No')) + '</td>' + num(s.due, s.due ? 'diff-bad' : '') + '</tr>';
  }
  function save(msg) { return Z.save('registers', A.doc).then(function (d) { A.doc = d; E.ADJ_REGS.forEach(function (k) { A.doc[k] = Array.isArray(A.doc[k]) ? A.doc[k] : []; }); render(); if (msg) Z.toast(msg); }); }
  Z.CHG.adjent = function (el) { location.hash = '#/' + S.tax + '/adjust/' + el.value; };
  Z.ACT.adjjump = function (el) { var x = document.getElementById('reg-' + REG[el.dataset.k].check); if (x) { x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.add('flash'); setTimeout(function () { x.classList.remove('flash'); }, 1600); } };
  Z.ACT.adjedit = function (el) {
    if (Z.closeDrawer) Z.closeDrawer(true);

      var v = it[fd[0]]; if (BOOL[fd[0]]) v = v === true ? 'yes' : v === false ? 'no' : v;
      if (fd[2] === 'select') return '<label class="f"><span>' + esc(t(fd[1])) + '</span><select name="' + fd[0] + '">' + fd[3].map(function (o) { return '<option value="' + o[0] + '"' + (String(v == null ? '' : v) === o[0] ? ' selected' : '') + '>' + esc(t(o[1])) + '</option>'; }).join('') + '</select></label>';
      return Z.fld(fd[0], t(fd[1]), v, fd[2], (fd[3] || '') + (fd[2] === 'number' && !/step=/.test(fd[3] || '') ? ' step="0.01"' : ''));
    }).join('');
    var uses = '';
    if (k === 'capital' && i >= 0) {
      var s = E.capitalAdjust(it, cfg(), Z.today()), y0 = +String(E.date(it.acquiredOn) || '').slice(0, 4), last = Math.min(y0 + s.period - 1, +Z.today().slice(0, 4) - 1), byY = {};
      (it.uses || []).forEach(function (u) { if (u) byY[u.year] = u; });
      for (var y = y0 + 1; y0 && y <= last; y++) uses += '<tr><td>' + y + '</td><td><input type="number" step="0.01" min="0" max="100" name="use-' + y + '" value="' + esc(byY[y] && byY[y].pct != null ? byY[y].pct : '') + '" aria-label="' + esc(t('Taxable use') + ' ' + y) + '"></td><td><label class="zk-cbx"><input type="checkbox" name="dec-' + y + '"' + (byY[y] && byY[y].declared ? ' checked' : '') + '> ' + t('Adjusted in a return') + '</label></td></tr>';
      uses = uses ? '<h3 style="grid-column:1/-1;margin:8px 0 0">' + t('Taxable use by year (%)') + '</h3><table class="t" style="grid-column:1/-1"><tbody>' + uses + '</tbody></table>' : '';
    }
    Z.modal((i >= 0 ? t('Edit') : t('Add')) + ': ' + t(R.title), '<form id="adjf" class="grid g2">' + f + uses + '</form>',
      (i >= 0 ? '<button class="btn danger" data-act="adjdel">' + t('Delete') + '</button>' : '') + '<button class="btn" data-act="closemodal">' + t('Cancel') + '</button><button class="btn primary" data-act="adjsave">' + t('Save') + '</button>');
  };
  Z.ACT.adjsave = function () {
    var f = document.getElementById('adjf'); if (!f.reportValidity()) return;
    var k = A.edit.k, i = A.edit.i, prev = i >= 0 ? A.doc[k][i] : {}, d = Object.assign({}, prev), fd = new FormData(f);
    REG[k].fields.forEach(function (x) { var v = fd.get(x[0]); if (v == null) return; d[x[0]] = BOOL[x[0]] ? v === 'yes' : x[2] === 'number' ? (v === '' ? null : +v) : v.trim(); });
    if (k === 'capital') {
      var uses = []; fd.forEach(function (v, key) { var m = /^use-(\d{4})$/.exec(key); if (m && v !== '') uses.push({ year: +m[1], pct: +v, declared: fd.get('dec-' + m[1]) === 'on' }); });
      var keep = (prev.uses || []).filter(function (u) { return u && !fd.has('use-' + u.year); });
      if (i >= 0) d.uses = keep.concat(uses).sort(function (a, b) { return a.year - b.year; }); else d.uses = [];
    }
    if (i >= 0) A.doc[k][i] = d; else A.doc[k].push(d);

  D.adj = function (k) {

    var lines = [];
    E.ADJ_REGS.forEach(function (rk) { res[rk].forEach(function (x, i) {
      var label = x.item.name || x.item.customer || x.item.invoice || x.item.party || '-';

    if (k === 'rec') return { title: t('VAT to reclaim (SAR)'), total: res.recover, totalLabel: 'SAR', rows: lines.filter(function (l) { return l.rec; }).map(function (l) { return { label: l.label, sub: l.sub, value: l.rec, tone: 'pass', act: l.act, data: l.data }; }), empty: t('Nothing to reclaim.') };
    if (k === 'issues') return { title: t('Registers with issues'), money: false, total: res.issues, totalLabel: t('registers'), rows: res.checks.filter(function (c) { return c.status === 'fail' || c.status === 'warn'; }).map(function (c, i) { return { label: c.id + ' ' + (ar() ? c.titleAr : c.title), value: c.exposure || 0, display: c.exposure ? fmt(c.exposure) : t('Review'), tone: c.status === 'fail' ? 'fail' : 'warn', href: '#reg-' + c.id }; }), empty: t('No issues.') };
    return null;
  };

<script>
/* Wave 3: income tax on the non-Saudi share with advance payments and transfer
   pricing (one `corporate` doc per entity and year), e-invoicing devices (`devices`,
   one doc per entity), the VAT group (`groups`), the board's tax risk report, and

(function () {
  'use strict';

  function chk(c) {
    var figs = c.status === 'na' ? '<span>' + t('Needs') + ': <b>' + esc(t(c.missing || '')) + '</b></span>' :
      (c.aLabel ? '<span>' + esc(t(c.aLabel)) + ': <b>' + (/Expired|Devices|Members/.test(c.aLabel) ? Z.count(c.a) : fmt(c.a)) + '</b></span>' : '') + (c.bLabel ? '<span>' + esc(t(c.bLabel)) + ': <b>' + fmt(c.b) + '</b></span>' : '') + (c.exposure ? '<span class="d fail">' + t('Exposure') + ': <b>' + fmt(c.exposure) + '</b></span>' : '');
    var list = (c.exceptions && c.exceptions.list) || [];
    return '<div class="check" id="c-' + c.id + '">' + Z.tick(c.status) + '<div><h3>' + esc(c.id) + ' · ' + esc(ar() ? c.titleAr : c.title) + '</h3><div class="figs">' + figs + '</div>' +
      (c.note ? '<p class="faint" style="font-size:12.5px;margin:4px 0 0">' + esc(ar() && c.noteAr ? c.noteAr : t(c.note)) + '</p>' : '') + (list.length ? '<details><summary>' + t('Show the items') + ' (' + list.length + ')</summary>' + Z.rowsTable(list) + '</details>' : '') + '</div><div class="acts"></div></div>';
  }
  var yes = function (v) { return v === true || v === 'yes'; };
  var TPT = { services: 'Services', goods: 'Goods', loans: 'Loans and interest', royalties: 'Royalties', management: 'Management fees', other: 'Other' };

  // ================================================================ income tax and transfer pricing
  var C = {};
  Z.views.corporate = function (h) {
    var e = Z.entity(h[1]) || Z.entity(S.entityId) || S.entities[0], year = +h[2] || +Z.today().slice(0, 4);

    return Z.get('corporate', e.id + '_corp_' + year).then(function (doc) {
      C.e = e; C.year = year; C.doc = doc || { id: e.id + '_corp_' + year, entityId: e.id, year: year, fyEnd: year + '-12-31', instalments: [], transactions: [], label: 'Income tax ' + year };
      C.doc.instalments = Array.isArray(C.doc.instalments) ? C.doc.instalments : []; C.doc.transactions = Array.isArray(C.doc.transactions) ? C.doc.transactions : [];
      renderCorp();
    });
  };
  function renderCorp() {
    var d = C.doc, e = C.e, can = Z.can('preparer'), cit = E.citStatus(d, cfg(), Z.today()), tp = E.tpStatus(d, cfg(), Z.today());
    var dis = can ? '' : ' disabled';
    var f = function (k, label, type, hint, attrs) { return Z.fld('c_' + k, label, d[k], type, 'data-chg="corp" data-f="' + k + '"' + (attrs || '') + dis, hint); };
    var sel = function (k, label, opts) { return '<label class="f"><span>' + esc(label) + '</span><select data-chg="corp" data-f="' + k + '"' + dis + '>' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (String(d[k] == null ? '' : d[k]) === o[0] ? ' selected' : '') + '>' + esc(t(o[1])) + '</option>'; }).join('') + '</select></label>'; };

        '<span class="zk-inst-s">' + esc(t({ paid: 'Paid on time', late: 'Paid late', overdue: 'Overdue', due: 'Not yet due' }[r.state])) + (r.fine ? ', ' + t('fine') + ' ' + fmt(r.fine) : '') + '</span>' +
        '<div class="grid g2">' + Z.fld('ip' + i, t('Paid on'), (d.instalments[i] || {}).paidOn, 'date', 'data-chg="corpinst" data-i="' + i + '" data-f="paidOn"' + dis) + Z.fld('ia' + i, t('Amount paid'), (d.instalments[i] || {}).amount, 'number', 'step="0.01" data-chg="corpinst" data-i="' + i + '" data-f="amount"' + dis) + '</div></div>';
    }).join('') + '</div>' : '<p class="muted">' + (cit.prior ? t('No advance payments are due this year.') : t('Enter last year\'s income tax to see whether advance payments are due.')) + '</p>';
    var types = Object.keys(tp.byType), maxT = Math.max.apply(null, types.map(function (k) { return tp.byType[k]; }).concat([1]));
    var gauge = '<div class="zk-gauge" role="img" aria-label="' + esc(t('Controlled transactions against the SAR 6 million threshold')) + '"><div class="zk-gauge-t"><i style="--w:' + Math.min(100, tp.total / (E.mergeSettings(cfg()).tp.fileThreshold) * 100).toFixed(1) + '%" class="' + (tp.filesRequired ? 'over' : '') + '"></i></div><span>' + fmt(tp.total) + ' / ' + fmt(E.mergeSettings(cfg()).tp.fileThreshold) + '</span></div>';
    Z.setMain(head(t('Income tax'), 'bank', t('Income tax and transfer pricing') + ': ' + Z.entName(e) + ' ' + C.year, t('Income tax on the share owned by non-Saudi shareholders, the advance payments it triggers, and the transfer pricing filings that go with the return.'),
      entSel('corpent', e.id) + '<select data-chg="corpyear" aria-label="' + esc(t('Year')) + '">' + years.map(function (y) { return '<option' + (y === C.year ? ' selected' : '') + '>' + y + '</option>'; }).join('') + '</select>') +

        '<h2>' + t('Where the risk is') + '</h2><div class="hbars">' + bars.map(function (b, i) { return '<div class="hb" style="--i:' + i + '"><span>' + esc(t(b[0])) + '</span><div class="track"><i style="--w:' + Math.max(1, b[1] / max * 100).toFixed(1) + '%"></i></div><b class="num">' + fmt(b[1]) + '</b></div>'; }).join('') + '</div>' +
        '<h2>' + t('By company') + '</h2><div class="tbl-wrap"><table class="t"><thead><tr><th>' + t('Company') + '</th><th>' + t('Latest period') + '</th><th>' + t('Readiness') + '</th><th class="num">' + t('Exposure (SAR)') + '</th><th class="num">' + t('ZATCA statement') + '</th><th class="num">' + t('VAT adjustments') + '</th><th class="num">' + t('Income tax') + '</th><th class="num">' + t('Open disputes') + '</th><th class="num">' + t('Refunds outstanding') + '</th></tr></thead><tbody>' +
        rows.map(function (x) { return '<tr><td><a href="#/' + S.tax + '/insights/' + x.e.id + '">' + esc(Z.entName(x.e)) + '</a></td><td>' + Z.ltr(x.period || '-') + '</td><td>' + (x.score != null ? Z.pill(x.grade, x.score + '%') : '-') + '</td><td class="num">' + fmt(x.expo) + '</td><td class="num">' + fmt(x.soa) + '</td><td class="num">' + fmt(x.adj) + '</td><td class="num">' + fmt(x.cit) + '</td><td class="num">' + fmt(x.stake) + '</td><td class="num">' + fmt(x.refund) + '</td></tr>'; }).join('') +
        '<tr class="total"><td colspan="3">' + t('Total') + '</td><td class="num">' + fmt(tot('expo')) + '</td><td class="num">' + fmt(tot('soa')) + '</td><td class="num">' + fmt(tot('adj')) + '</td><td class="num">' + fmt(tot('cit')) + '</td><td class="num">' + fmt(tot('stake')) + '</td><td class="num">' + fmt(tot('refund')) + '</td></tr></tbody></table></div>' +
        '<p class="faint" style="font-size:12px;margin-top:14px">' + t('Estimates from the checks and the penalty rates in Settings. Not legal advice.') + '</p></article>');
    });
  };

  // ================================================================ attachments
  var TYPES = { pdf: 'application/pdf', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', csv: 'text/csv', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', xls: 'application/vnd.ms-excel', docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' };
  var MAX = 2 * 1024 * 1024;
  // a strip of files under a record: owner is "table:id"
  Z.attachHtml = function (owner, entityId) {
    if (!owner || !entityId) return '';
    setTimeout(function () { Z.paintAttach(owner); }, 0);
    return '<div class="zk-att" data-owner="' + esc(owner) + '" data-ent="' + esc(entityId) + '"><span class="faint">' + t('Loading…') + '</span></div>';
  };
  Z.paintAttach = function (owner) {
    var box = document.querySelector('.zk-att[data-owner="' + owner + '"]'); if (!box) return;
    Z.list('attachments').then(function (all) {
      box = document.querySelector('.zk-att[data-owner="' + owner + '"]'); if (!box) return;
      var mine = all.filter(function (a) { return a.owner === owner; });
      box.innerHTML = '<span class="zk-att-h">' + Z.icon('paperclip') + t('Evidence') + '</span>' + mine.map(function (a) { return '<span class="zk-file"><a href="#" data-act="attget" data-id="' + esc(a.id) + '">' + Z.icon(a.type === 'application/pdf' ? 'file-pdf' : /image/.test(a.type) ? 'image' : 'file-xls') + esc(a.name) + '</a><small>' + Math.max(1, Math.round(a.size / 1024)) + ' KB</small>' + (Z.can('preparer') ? '<button type="button" class="btn ghost small icon" data-act="attdel" data-id="' + esc(a.id) + '" data-owner="' + esc(owner) + '" aria-label="' + esc(t('Remove') + ' ' + a.name) + '">' + Z.icon('x') + '</button>' : '') + '</span>'; }).join('') +
        (Z.can('preparer') ? '<button type="button" class="btn small" data-act="attadd" data-owner="' + esc(owner) + '">' + Z.icon('upload-simple') + ' ' + t('Attach a file') + '</button>' : '') + (mine.length || Z.can('preparer') ? '' : '<span class="faint">' + t('No files') + '</span>');
    }).catch(function () { box.innerHTML = ''; });
  };
  Z.ACT.attadd = function (el) {
    var owner = el.dataset.owner, ent = (el.closest('.zk-att') || {}).dataset.ent;
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = Object.keys(TYPES).map(function (x) { return '.' + x; }).join(',');
    inp.onchange = function () {
      var file = inp.files[0]; if (!file) return;
      var ext = (file.name.split('.').pop() || '').toLowerCase(), type = TYPES[ext];
      if (!type) return Z.toast(t('Attach PDF, image, Excel, Word or CSV files.'), true);
      if (file.size > MAX) return Z.toast(t('Files up to 2 MB can be attached.'), true);
      var rd = new FileReader();
      rd.onload = function () {
        var data = String(rd.result).split(',')[1] || '', id = Z.uid('AT');
        Z.save('files', { id: id, entityId: ent, data: data }).then(function () {
          return Z.save('attachments', { id: id, entityId: ent, owner: owner, name: file.name, type: type, size: file.size, label: file.name });
        }).then(function () { Z.toast(t('File attached')); Z.paintAttach(owner); });
      };
      rd.readAsDataURL(file);
    };
    inp.click();
  };
  Z.ACT.attget = function (el) {
    Promise.all([Z.get('attachments', el.dataset.id), Z.get('files', el.dataset.id)]).then(function (r) {
      var a = r[0], f = r[1]; if (!a || !f) return Z.toast(t('This file is no longer available.'), true);
      var bin = atob(f.data), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      // always a download, never shown inline: the type comes from the allow-list
      var type = Object.keys(TYPES).map(function (k) { return TYPES[k]; }).indexOf(a.type) >= 0 ? a.type : 'application/octet-stream';
      var url = URL.createObjectURL(new Blob([u8], { type: type })), link = document.createElement('a');
      link.href = url; link.download = String(a.name || 'file').replace(/[\\/:*?"<>|]/g, '_'); document.body.appendChild(link); link.click();
      setTimeout(function () { URL.revokeObjectURL(url); link.remove(); }, 500);
    });
  };
  Z.ACT.attdel = function (el) { if (!confirm(t('Remove this file?'))) return; Z.call('remove', { table: 'attachments', id: el.dataset.id }).then(function () { Z.paintAttach(el.dataset.owner); }); };
})();

</script>
<script>Z.boot();</script>
</body>
</html>
