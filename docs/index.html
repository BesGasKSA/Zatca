  // ------------------------------------------------------------------ normalizers
  function r2(x) { return Math.round((+x || 0) * 100) / 100; }
  E.r2 = r2;

  var AR_DIGITS = /[٠-٩۰-۹]/g;
  function deArabic(s) {
    return String(s).replace(AR_DIGITS, function (c) {
      var code = c.charCodeAt(0);
      return String(code >= 0x06F0 ? code - 0x06F0 : code - 0x0660);
    }).replace(/٫/g, '.').replace(/٬/g, ',');
  }

  E.num = function (v) {
    if (v == null || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var s = deArabic(v).trim();
    var neg = /^\(.*\)$/.test(s) || /-$/.test(s) || /^-/.test(s);
    s = s.replace(/[^\d.,]/g, '');
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/,/g, '');
    else if (/,\d{1,2}$/.test(s) && s.split(',').length === 2 && s.indexOf('.') < 0 && !/,\d{3}$/.test(s)) s = s.replace(',', '.');
    else s = s.replace(/,/g, '');
    var n = parseFloat(s);
    if (!isFinite(n)) return 0;
    return neg ? -n : n;
  };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(y, m, d) {
    if (!(y >= 1900 && y <= 2200 && m >= 1 && m <= 12 && d >= 1)) return '';
    var t = new Date(Date.UTC(y, m - 1, d));
    if (t.getUTCMonth() !== m - 1 || t.getUTCDate() !== d) return '';
    return y + '-' + pad(m) + '-' + pad(d);
  }

  // Returns 'YYYY-MM-DD' or '' - Saudi files are day-first, so 03/04/2026 is 3 April.
  E.date = function (v) {
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth() + 1, v.getDate());
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      var d = new Date(Math.round((v - 25569) * 86400000));
      return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    var s = deArabic(v).trim(), m;
    if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return iso(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) {
      var a = +m[1], b = +m[2], y = +m[3];
      if (y < 100) y += 2000;
      if (a > 12) return iso(y, b, a);
      if (b > 12) return iso(y, a, b);
      return iso(y, b, a);
    }
    var MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
    if ((m = s.match(/^(\d{1,2})[\s-]([A-Za-z]{3})[A-Za-z]*[\s-](\d{2,4})/))) {
      var mo = MON[m[2].toLowerCase()];
      if (mo) return iso(+m[3] < 100 ? 2000 + +m[3] : +m[3], mo, +m[1]);
    }
    return '';
  };

  E.str = function (v) { return v == null ? '' : deArabic(v).trim(); };

  // 'YYYY-MM-DDTHH:MM' or ''. Used for e-invoicing issue / submission times.
  E.datetime = function (v) {
    if (v == null || v === '') return '';
    if (v instanceof Date && !isNaN(v)) return iso(v.getFullYear(), v.getMonth() + 1, v.getDate()) + 'T' + pad(v.getHours()) + ':' + pad(v.getMinutes());
    if (typeof v === 'number' && v > 20000 && v < 80000) { var d = new Date(Math.round((v - 25569) * 86400000)); return d.toISOString().slice(0, 16); }
    var s = deArabic(v).trim(), m;
    if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})[T ](\d{1,2}):(\d{2})/))) return iso(+m[1], +m[2], +m[3]) && +m[4] < 24 && +m[5] < 60 ? m[1] + '-' + m[2] + '-' + m[3] + 'T' + pad(+m[4]) + ':' + m[5] : '';
    if ((m = s.match(/^(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})[ T]+(\d{1,2}):(\d{2})/))) { var dd = E.date(m[1]); return dd ? dd + 'T' + pad(+m[2]) + ':' + m[3] : ''; }

  function minutesBetween(a, b) { return Math.round((Date.parse(b + ':00Z') - Date.parse(a + ':00Z')) / 60000); }
  E.minutesBetween = minutesBetween;

  E.invType = function (v) {
    var s = String(v || '').toLowerCase();
    if (/simpl|b2c|0200|مبسط/.test(s)) return 'simplified';

    return '';
  };
  E.einvStatus = function (v) {
    var s = String(v || '').toLowerCase();
    if (/reject|fail|error|مرفوض|رفض|خطأ/.test(s)) return 'REJECTED';
    if (/warn|تحذير/.test(s)) return 'WARNING';
    if (/clear|معتمد|اعتماد/.test(s)) return 'CLEARED';
    if (/report|مبلغ|إبلاغ|ابلاغ/.test(s)) return 'REPORTED';
    if (/pend|queue|انتظار|معلق/.test(s)) return 'PENDING';
    if (/not sent|not submitted|لم ي/.test(s)) return 'NOT_SUBMITTED';
    return s ? s.toUpperCase() : '';

  // TRN: 15 digits, first and last digit 3.
  E.validVatNo = function (v) { return /^3\d{13}3$/.test(String(v || '').replace(/\s/g, '')); };

  E.flow = function (v) {
    var s = String(v || '').toLowerCase().trim();
    if (/^(p|purchase|purchases|ap|buy|input|مشتريات|مشتري|شراء|مدخلات)/.test(s)) return 'P';
    if (/^(s|sale|sales|ar|output|مبيعات|بيع|مخرجات)/.test(s)) return 'S';
    return '';

  // Maps whatever tax code the ERP uses onto the ZATCA categories.
  E.category = function (v, flow) {
    var s = String(v || '').toLowerCase().replace(/\s+/g, ' ').trim();
    if (!s) return '';
    if (/rcm|reverse|عكسي/.test(s)) return 'RCM';
    if (/import|customs|استيراد|جمارك|imp/.test(s)) return flow === 'P' ? 'IMP' : 'X';
    if (/export|صادر|^x$/.test(s)) return 'X';
    if (/citizen|health|education|مواطن|صحة|تعليم|^sc$/.test(s)) return 'SC';
    if (/exempt|معف|^e$/.test(s)) return 'E';
    if (/out of scope|outside|خارج|^o$|^oos$/.test(s)) return 'O';
    if (/zero|صفر|^z$|^0%?$/.test(s)) return 'Z';
    if (/standard|15|اساس|أساس|^s$|^sr$|^std$/.test(s)) return 'S';
    return s.toUpperCase();

  E.docType = function (v) {
    var s = String(v || '').toLowerCase();
    if (/credit|cn|اشعار دائن|إشعار دائن|مرتجع|return/.test(s)) return 'CN';
    if (/debit|dn|اشعار مدين|إشعار مدين/.test(s)) return 'DN';
    return 'INV';
  };

  E.whtType = function (v) {
    var s = String(v || '').toLowerCase();
    if (!s) return 'other';
    for (var i = 0; i < E.WHT_TYPES.length; i++) if (s === E.WHT_TYPES[i][0]) return s;
    if (/manag|إدار|ادار/.test(s)) return 'management_fees';
    if (/royalt|إتاو|اتاو|licen/.test(s)) return 'royalties';
    if (/head office|related|مركز|مرتبط/.test(s)) return 'head_office_services';
    if (/rent|lease|إيجار|ايجار/.test(s)) return 'rent';
    if (/consult|استشار/.test(s)) return 'consulting_services';
    if (/techn|فني/.test(s)) return 'technical_services';
    if (/ticket|freight|shipping|تذاكر|شحن/.test(s)) return 'air_tickets_freight';
    if (/telecom|اتصال/.test(s)) return 'intl_telecom';
    if (/dividend|أرباح|ارباح/.test(s)) return 'dividends';
    if (/loan|interest|قرض|عوائد|فوائد/.test(s)) return 'loan_returns';
    if (/insur|تأمين|تامين/.test(s)) return 'insurance';
    return 'other';
  };

  function normHeader(h) { return String(h == null ? '' : h).toLowerCase().replace(/[_\-:]+/g, ' ').replace(/\s+/g, ' ').trim(); }

  E.autoMap = function (headers, kind) {
    var def = E.KINDS[kind], map = {}, used = {};
    var H = headers.map(normHeader);
    def.fields.forEach(function (f) {
      var best = -1, bestScore = 0;
      H.forEach(function (h, i) {
        if (used[i] || !h) return;
        var sc = 0;
        if (h === f.k.toLowerCase()) sc = 100;
        f.syn.forEach(function (s, si) {
          if (h === s) sc = Math.max(sc, 90 - si);
          else if (h.indexOf(s) >= 0 && s.length >= 3) sc = Math.max(sc, 40 + s.length - si);
        });
        if (sc > bestScore) { bestScore = sc; best = i; }
      });
      if (best >= 0) { map[f.k] = best; used[best] = 1; }
    });
    return map;
  };

  // Import profiles: once a company's file has been mapped, remember each field's header
  // text; the next file whose header row holds the same texts is mapped the same way.
  E.profileFrom = function (headerRow, map) {
    var h = {}; Object.keys(map || {}).forEach(function (f) { var v = normHeader((headerRow || [])[map[f]]); if (v) h[f] = v; });
    return h;
  };
  E.applyProfile = function (aoa, headers) {
    var want = Object.keys(headers || {}); if (!want.length) return null;
    for (var r = 0; r < Math.min(15, (aoa || []).length); r++) {
      var row = (aoa[r] || []).map(normHeader), map = {}, ok = true;
      want.forEach(function (f) { var i = row.indexOf(headers[f]); if (i < 0) ok = false; else map[f] = i; });
      if (ok) return { row: r, map: map };
    }
    return null;
  };

  // The header row is the first of the top 15 rows that names the most fields.
  E.detectHeader = function (aoa, kind) {
    var best = { row: 0, hits: -1, map: {} };
    for (var r = 0; r < Math.min(15, aoa.length); r++) {
      var row = aoa[r] || [];
      var map = E.autoMap(row, kind);
      var hits = Object.keys(map).length;
      if (hits > best.hits) best = { row: r, hits: hits, map: map };
    }
    return best;
  };

  E.normalizeRows = function (aoa, headerRow, map, kind) {
    var def = E.KINDS[kind], rows = [], errors = [];
    for (var r = headerRow + 1; r < aoa.length; r++) {
      var src = aoa[r] || [];
      if (!src.some(function (c) { return c !== '' && c != null; })) continue;
      var o = {}, bad = [];
      def.fields.forEach(function (f) {
        var v = map[f.k] == null || map[f.k] === '' ? '' : src[map[f.k]];
        if (f.t === 'n') o[f.k] = r2(E.num(v));
        else if (f.t === 't') o[f.k] = E.datetime(v);
        else if (f.t === 'd') { o[f.k] = E.date(v); if (f.req && !o[f.k]) bad.push(f.k); }
        else { o[f.k] = E.str(v); if (f.req && !o[f.k]) bad.push(f.k); }
      });
      // a total row ("Total", "الإجمالي") is not a record
      var firstText = String(src.find(function (c) { return typeof c === 'string' && c.trim(); }) || '').toLowerCase();
      if (/^(grand )?total|^الإجمالي|^الاجمالي|^المجموع/.test(firstText)) continue;
      if (kind === 'sys_vat') {
        o.flow = E.flow(o.flow);
        if (!o.flow) bad.push('flow');
        o.category = E.category(o.category, o.flow);
        o.docType = E.docType(o.docType);
        if (o.docType === 'CN' && o.net > 0) { o.net = -o.net; o.vat = -Math.abs(o.vat); }
        if (!o.total) o.total = r2(o.net + o.vat);
      }
      if (kind === 'wht_reg' || kind === 'ret_wht' || kind === 'xls_wht') {
        o.paymentType = E.whtType(o.paymentType);
        if (o.rate > 1) o.rate = o.rate / 100;
      }
      if (kind === 'bank') { o.debit = Math.abs(o.debit); o.credit = Math.abs(o.credit); }
      if (kind === 'einv_provider') { o.type = E.invType(o.type); o.status = E.einvStatus(o.status); o.docType = E.docType(o.docType); }
      if (kind === 'einv') o.status = E.einvStatus(o.status) || o.status;
      if (kind === 'excise' && o.rate > 1) o.rate = o.rate / 100;
      if (bad.length) errors.push({ row: r + 1, fields: bad });
      o._r = r + 1;
      rows.push(o);
    }
    return { rows: rows, errors: errors };
  };

  E.boxesFromRows = function (rows) {
    var b = emptyBoxes();
    (rows || []).forEach(function (x) {
      var n = Math.round(+x.box);
      if (n >= 1 && n <= 16) { b[n].amount += +x.amount || 0; b[n].adj += +x.adj || 0; b[n].vat += +x.vat || 0; }
    });
    return E.completeBoxes(b, true);
  };

  // ------------------------------------------------------------------ periods
  // Period keys: 'YYYY-MM' for months, 'YYYY-Qn' for quarters.
  E.periodRange = function (key) {
    var m = String(key).match(/^(\d{4})-(\d{2})$/), q = String(key).match(/^(\d{4})-Q([1-4])$/);
    var y, m1, m2;
    if (m) { y = +m[1]; m1 = m2 = +m[2]; }
    else if (q) { y = +q[1]; m1 = (+q[2] - 1) * 3 + 1; m2 = m1 + 2; }
    else return null;
    var last = new Date(Date.UTC(y, m2, 0)).getUTCDate();
    return { start: iso(y, m1, 1), end: iso(y, m2, last), y: y, m1: m1, m2: m2 };
  };

  E.prevPeriod = function (key) {
    var m = String(key).match(/^(\d{4})-(\d{2})$/), q = String(key).match(/^(\d{4})-Q([1-4])$/);
    if (m) { var y = +m[1], mo = +m[2] - 1; if (!mo) { y--; mo = 12; } return y + '-' + pad(mo); }
    if (q) { var yy = +q[1], qq = +q[2] - 1; if (!qq) { yy--; qq = 4; } return yy + '-Q' + qq; }
    return '';
  };

  E.periodOf = function (dateIso, freq) {
    var y = dateIso.slice(0, 4), mo = +dateIso.slice(5, 7);
    return freq === 'quarterly' ? y + '-Q' + Math.ceil(mo / 3) : y + '-' + pad(mo);
  };

  E.recentPeriods = function (freq, n, todayIso) {
    var out = [], k = E.periodOf(todayIso || new Date().toISOString().slice(0, 10), freq);
    for (var i = 0; i < n; i++) { k = E.prevPeriod(k); out.push(k); }
    return out;
  };

  function addDays(isoD, n) { var d = new Date(isoD + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }
  E.daysBetween = daysBetween;

  // VAT: last day of the month after the period. WHT: 10th of the month after each month.
  E.deadlines = function (periodKey) {
    var r = E.periodRange(periodKey);
    if (!r) return {};
    var vatDue = new Date(Date.UTC(r.y, r.m2 + 1, 0)).toISOString().slice(0, 10);
    var whtDue = new Date(Date.UTC(r.y, r.m2, 10)).toISOString().slice(0, 10);
    return { vat: vatDue, wht: whtDue };
  };

  // ------------------------------------------------------------------ ledger helpers
  function patterns(list) {
    return String(list || '').split(/[,;\s]+/).filter(Boolean).map(function (p) {
      p = p.trim();
      if (p.slice(-1) === '*') { var pre = p.slice(0, -1); return function (a) { return String(a).indexOf(pre) === 0; }; }
      if (p.indexOf('-') > 0) { var ab = p.split('-'); return function (a) { return String(a) >= ab[0] && String(a) <= ab[1] && String(a).length === ab[0].length; }; }
      return function (a) { return String(a) === p; };
    });
  }
  function matches(acc, pats) { for (var i = 0; i < pats.length; i++) if (pats[i](acc)) return true; return false; }
  E.accountMatcher = function (list) { var p = patterns(list); return function (a) { return matches(a, p); }; };

  // Debit-positive movement for the mapped accounts.
  E.tbMovement = function (tb, list, basis, side) {
    var pats = patterns(list);
    if (!pats.length || !tb || !tb.length) return null;
    var tot = 0, found = false;
    tb.forEach(function (r) {
      if (!matches(r.account, pats)) return;
      found = true;
      var hasDC = (+r.debit || 0) !== 0 || (+r.credit || 0) !== 0;
      if (basis === 'gross' && hasDC) tot += side === 'credit' ? -(+r.credit || 0) : (+r.debit || 0);
      else if (hasDC) tot += (+r.debit || 0) - (+r.credit || 0);
      else tot += (+r.closing || 0) - (+r.opening || 0);
    });
    return found ? r2(tot) : null;
  };

  E.tbBalance = function (tb, list, which) {
    var pats = patterns(list);
    if (!pats.length || !tb || !tb.length) return null;
    var tot = 0, found = false;
    tb.forEach(function (r) {
      if (!matches(r.account, pats)) return;
      found = true;
      var v = which === 'opening' ? +r.opening || 0 : (r.closing !== 0 || (!r.debit && !r.credit) ? +r.closing || 0 : (+r.opening || 0) + (+r.debit || 0) - (+r.credit || 0));
      tot += v;
    });
    return found ? r2(tot) : null;
  };

  // From GL detail, leaving out the month-end settlement journal that moves
  // output and input VAT into the payable account.
  E.glMovement = function (gl, list, settlementKeywords) {
    var pats = patterns(list);
    if (!pats.length || !gl || !gl.length) return null;
    var keys = String(settlementKeywords || '').toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var tot = 0, found = false, excluded = 0;
    gl.forEach(function (r) {
      if (!matches(r.account, pats)) return;
      found = true;
      var d = String(r.description || '').toLowerCase();
      if (keys.some(function (k) { return d.indexOf(k) >= 0; })) { excluded += (+r.debit || 0) - (+r.credit || 0); return; }
      tot += (+r.debit || 0) - (+r.credit || 0);
    });
    return found ? { value: r2(tot), excluded: r2(excluded) } : null;
  };

  // ------------------------------------------------------------------ check helpers
  function status(diff, base, S) {
    var d = Math.abs(diff);
    if (d <= S.tolAbs) return 'pass';
    if (d <= Math.min(Math.abs(base || 0) * S.tolPct, S.tolWarnAbs == null ? Infinity : S.tolWarnAbs)) return 'warn';
    return 'fail';
  }
  E.status = status;
  var RANK = { na: 0, pass: 1, warn: 2, fail: 3 };
  function worst(list) { return list.reduce(function (w, s) { return RANK[s] > RANK[w] ? s : w; }, 'pass'); }
  E.worst = worst;

  function check(id, group, title, titleAr, a, aLabel, b, bLabel, S, extra) {
    var c = { id: id, group: group, title: title, titleAr: titleAr, aLabel: aLabel, bLabel: bLabel };
    if (a == null || b == null) { c.status = 'na'; c.a = a; c.b = b; c.diff = null; c.missing = a == null ? aLabel : bLabel; }
    else { c.a = r2(a); c.b = r2(b); c.diff = r2(a - b); c.status = status(c.diff, Math.max(Math.abs(a), Math.abs(b)), S); }
    if (extra) Object.keys(extra).forEach(function (k) { c[k] = extra[k]; });
    return c;
  }

  // ------------------------------------------------------------------ VAT reconciliation
  E.boxesFromSystem = function (rows) {
    var b = emptyBoxes();
    var catBox = { S: { S: 1, SC: 2, Z: 3, X: 4, E: 5 }, P: { S: 7, IMP: 8, RCM: 9, Z: 10, E: 11 } };
    (rows || []).forEach(function (x) {
      var n = (catBox[x.flow] || {})[x.category];
      if (!n) return;
      b[n].amount += +x.net || 0;
      b[n].vat += +x.vat || 0;
    });
    for (var i = 1; i <= 12; i++) { b[i].amount = r2(b[i].amount); b[i].vat = r2(b[i].vat); }
    return E.completeBoxes(b);
  };

  function boxCompare(id, title, titleAr, A, aLabel, B, bLabel, S, useAdjA, useAdjB) {
    var lines = [];
    E.BOXES.forEach(function (bx) {
      if (bx.n > 13) return;
      var a = A[bx.n], b = B[bx.n];
      var aAmt = (+a.amount || 0) + (useAdjA ? +a.adj || 0 : 0), bAmt = (+b.amount || 0) + (useAdjB ? +b.adj || 0 : 0);
      var l = { box: bx.n, aAmount: r2(aAmt), bAmount: r2(bAmt), aVat: r2(a.vat), bVat: r2(b.vat) };
      l.dAmount = r2(l.aAmount - l.bAmount); l.dVat = r2(l.aVat - l.bVat);
      l.status = bx.vatOnly ? status(l.dVat, Math.max(Math.abs(l.aVat), Math.abs(l.bVat)), S)
        : worst([status(l.dAmount, Math.max(Math.abs(l.aAmount), Math.abs(l.bAmount)), S), status(l.dVat, Math.max(Math.abs(l.aVat), Math.abs(l.bVat)), S)]);
      lines.push(l);
    });
    var due = lines.filter(function (l) { return l.box === 13; })[0];
    return {
      id: id, group: 'vat', title: title, titleAr: titleAr, aLabel: aLabel, bLabel: bLabel, kind: 'boxes', lines: lines,
      status: worst(lines.map(function (l) { return l.status; })),
      a: due.aVat, b: due.bVat, diff: due.dVat
    };
  }

  E.runVatRecon = function (ctx) {
    var S = ctx.settings, D = ctx.data, map = (ctx.entity && ctx.entity.mapping) || {}, checks = [];
    var ret = ctx.returnBoxes ? E.completeBoxes(JSON.parse(JSON.stringify(ctx.returnBoxes)), true) : null;
    var sys = D.sys_vat && D.sys_vat.length ? E.boxesFromSystem(D.sys_vat) : null;
    var xls = D.xls_vat && D.xls_vat.length ? E.boxesFromRows(D.xls_vat) : null;
    var na = function (id, title, titleAr, miss) { return { id: id, group: 'vat', title: title, titleAr: titleAr, status: 'na', missing: miss }; };

    checks.push(ret && sys ? boxCompare('V1', 'VAT return vs system tax report', 'الإقرار مقابل تقرير الضريبة من النظام', ret, 'Return', sys, 'System', S, true, false)
      : na('V1', 'VAT return vs system tax report', 'الإقرار مقابل تقرير الضريبة من النظام', !ret ? 'VAT return' : 'System VAT report'));
    checks.push(ret && xls ? boxCompare('V2', 'VAT return vs Excel workings', 'الإقرار مقابل أوراق العمل', ret, 'Return', xls, 'Excel', S, true, true)
      : na('V2', 'VAT return vs Excel workings', 'الإقرار مقابل أوراق العمل', !ret ? 'VAT return' : 'Excel workings'));
    checks.push(sys && xls ? boxCompare('V3', 'System tax report vs Excel workings', 'تقرير النظام مقابل أوراق العمل', sys, 'System', xls, 'Excel', S, false, true)
      : na('V3', 'System tax report vs Excel workings', 'تقرير النظام مقابل أوراق العمل', !sys ? 'System VAT report' : 'Excel workings'));

    // Ledger side: GL detail if mapped accounts appear there, otherwise TB.
    function ledger(list, side) {
      var g = E.glMovement(D.gl, list, S.settlementKeywords);
      if (g) return { v: g.value, src: 'GL (settlement excluded: ' + g.excluded + ')' };
      var t = E.tbMovement(D.tb, list, S.glBasis, side);
      return t == null ? null : { v: t, src: 'TB (' + S.glBasis + ')' };
    }
    var outL = ledger(map.outputVat, 'credit'), inL = ledger(map.inputVat, 'debit');
    var rcmOut = map.rcmOutput ? ledger(map.rcmOutput, 'credit') : null;
    var retOut = ret ? (+ret[6].vat || 0) + (map.rcmOutput ? 0 : (+ret[9].vat || 0)) : null;
    checks.push(check('V4', 'vat', 'Output VAT: return vs general ledger', 'ضريبة المخرجات: الإقرار مقابل الأستاذ العام',
      retOut, 'Return (box 6' + (map.rcmOutput ? '' : ' + box 9') + ' VAT)', outL ? -outL.v : null, 'GL output VAT', S, { source: outL && outL.src, missingHint: map.outputVat ? '' : 'Map output VAT accounts on the entity' }));
    if (map.rcmOutput) checks.push(check('V4b', 'vat', 'Reverse-charge VAT: return box 9 vs GL', 'الاحتساب العكسي: البند 9 مقابل الأستاذ', ret ? ret[9].vat : null, 'Return box 9 VAT', rcmOut ? -rcmOut.v : null, 'GL RCM output', S));
    checks.push(check('V5', 'vat', 'Input VAT: return vs general ledger', 'ضريبة المدخلات: الإقرار مقابل الأستاذ العام',
      ret ? ret[12].vat : null, 'Return (box 12 VAT)', inL ? inL.v : null, 'GL input VAT', S, { source: inL && inL.src, missingHint: map.inputVat ? '' : 'Map input VAT accounts on the entity' }));

    // Revenue: TB revenue vs total sales, with explained reconciling items.
    var rev = E.tbMovement(D.tb, map.revenue, 'movement');
    var items = (ctx.reconItems || []).filter(function (i) { return i.check === 'V6'; });
    var explained = items.reduce(function (s, i) { return s + (+i.amount || 0); }, 0);
    var c6 = check('V6', 'vat', 'Revenue per TB vs total sales declared (box 6)', 'الإيرادات حسب الميزان مقابل إجمالي المبيعات (البند 6)',
      rev == null ? null : -rev - explained, 'TB revenue less explained items', ret ? (+ret[6].amount || 0) + (+ret[6].adj || 0) : null, 'Return box 6', S,
      { explained: r2(explained), tbRevenue: rev == null ? null : r2(-rev), items: items, missingHint: map.revenue ? '' : 'Map revenue accounts on the entity' });
    checks.push(c6);

    // Net VAT payable vs the payable account balance at period end.
    // Net VAT due vs the net of every VAT account at period end - works whether
    // or not a settlement journal moved the balances into the payable account.
    if (map.vatPayable || (map.outputVat && map.inputVat)) {
      var vatAccts = [map.outputVat, map.inputVat, map.rcmOutput, map.vatPayable].filter(Boolean).join(',');
      var bal = E.tbBalance(D.tb, vatAccts, 'closing'), open = E.tbBalance(D.tb, map.vatPayable, 'opening');
      // last period's liability still unpaid at the start of this one is not this period's VAT
      var paidPrev = ctx.prevNetVat != null && open != null ? Math.min(Math.max(-open, 0), Math.max(ctx.prevNetVat, 0)) : 0;
      var unpaidPrev = open != null ? Math.max(-open, 0) - paidPrev : 0;
      checks.push(check('V7', 'vat', 'Net VAT due (box 16) vs net VAT liability in GL', 'صافي الضريبة (البند 16) مقابل صافي التزام الضريبة في الأستاذ',
        ret ? ret[16].vat : null, 'Return box 16', bal == null ? null : -bal - unpaidPrev, 'GL VAT accounts (closing, net)', S));
    }
    if (D.customs && D.customs.length) {
      var cv = D.customs.reduce(function (s, x) { return s + (+x.vat || 0); }, 0);
      checks.push(check('V8', 'vat', 'Import VAT: return box 8 vs customs declarations', 'ضريبة الاستيراد: البند 8 مقابل البيانات الجمركية', ret ? ret[8].vat : null, 'Return box 8 VAT', cv, 'Customs declarations', S));
    }
    if (D.einv && D.einv.length && D.sys_vat) checks.push(einvCheck(D, S));
    return { checks: checks, boxes: { ret: ret, sys: sys, xls: xls }, ledger: { output: outL, input: inL, revenue: rev == null ? null : -rev } };
  };

  function einvCheck(D, S) {
    var sales = D.sys_vat.filter(function (x) { return x.flow === 'S'; });
    var byNo = {}, fat = {};
    sales.forEach(function (x) { byNo[x.invoice] = x; });
    D.einv.forEach(function (x) { fat[x.invoice] = x; });
    var notReported = sales.filter(function (x) { return !fat[x.invoice]; });
    var notInSystem = D.einv.filter(function (x) { return !byNo[x.invoice]; });
    var rejected = D.einv.filter(function (x) { return /reject|رفض|مرفوض/i.test(x.status); });
    var mismatch = D.einv.filter(function (x) { var s = byNo[x.invoice]; return s && Math.abs((+s.vat || 0) - (+x.vat || 0)) > S.tolAbs; });
    var sysVat = sales.reduce(function (s, x) { return s + (+x.vat || 0); }, 0);
    var fatVat = D.einv.reduce(function (s, x) { return s + (+x.vat || 0); }, 0);
    var c = check('V9', 'vat', 'E-invoicing (Fatoora) vs system sales', 'الفوترة الإلكترونية مقابل مبيعات النظام', sysVat, 'System sales VAT', fatVat, 'Fatoora VAT', S);
    c.exceptions = { notReported: notReported.slice(0, 300), notInSystem: notInSystem.slice(0, 300), rejected: rejected.slice(0, 300), mismatch: mismatch.slice(0, 300) };
    c.counts = { notReported: notReported.length, notInSystem: notInSystem.length, rejected: rejected.length, mismatch: mismatch.length };
    if (notReported.length || rejected.length || notInSystem.length) c.status = worst([c.status, 'fail']);
    return c;
  }

  // ------------------------------------------------------------------ bank reconciliation
  // Each bank line gets a class from keyword rules (tenant-editable), unless a
  // person set it by hand (overrides keyed by line number). Then receipts are
  // compared with sales, payments with purchases, ZATCA payments with the
  // prior returns, and foreign transfers with the WHT register.
  E.BANK_CLASSES = ['customer_receipt', 'supplier_payment', 'zatca_vat', 'zatca_wht', 'zakat', 'foreign_transfer', 'payroll', 'internal_transfer', 'financing', 'other_in', 'other_out'];

  E.classifyBank = function (rows, S, overrides) {
    var rules = {};
    Object.keys(S.bankRules || {}).forEach(function (k) {
      rules[k] = String(S.bankRules[k] || '').toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    });
    var order = ['zatca_wht', 'zatca_vat', 'zakat', 'internal_transfer', 'financing', 'payroll', 'foreign_transfer', 'customer_receipt', 'supplier_payment'];
    return (rows || []).map(function (r, i) {
      var key = String(r._k || r._r || i);
      var o = Object.assign({}, r);
      if (overrides && overrides[key]) { o.cls = overrides[key]; o.manual = true; return o; }
      var d = (String(r.description || '') + ' ' + String(r.reference || '')).toLowerCase();
      var inflow = (+r.credit || 0) > 0;
      var cls = '';
      for (var j = 0; j < order.length && !cls; j++) {
        var k = order[j];
        if (inflow && /payment|payroll|foreign|zakat|zatca/.test(k)) continue;
        if (!inflow && k === 'customer_receipt') continue;
        if ((rules[k] || []).some(function (w) { return d.indexOf(w) >= 0; })) cls = k;
      }
      if (!cls) cls = inflow ? 'customer_receipt' : 'other_out';
      o.cls = cls;
      return o;
    });
  };

  E.runBankRecon = function (ctx) {
    var S = ctx.settings, D = ctx.data, map = (ctx.entity && ctx.entity.mapping) || {}, checks = [];
    if (!D.bank || !D.bank.length) {
      return { checks: [{ id: 'B1', group: 'bank', title: 'Bank receipts vs declared sales', titleAr: 'المقبوضات البنكية مقابل المبيعات المقرة', status: 'na', missing: 'Bank statements' }], lines: [], summary: {} };
    }
    var lines = E.classifyBank(D.bank, S, ctx.bankOverrides);
    var sum = {};
    lines.forEach(function (l) { sum[l.cls] = r2((sum[l.cls] || 0) + (+l.credit || 0) - (+l.debit || 0)); });
    var ret = ctx.returnBoxes ? E.completeBoxes(JSON.parse(JSON.stringify(ctx.returnBoxes)), true) : null;
    var sys = D.sys_vat && D.sys_vat.length ? E.boxesFromSystem(D.sys_vat) : null;
    var B = ret || sys;

    // Sales incl. VAT less the rise in receivables ≈ cash received from customers.
    var salesGross = B ? (+B[6].amount || 0) + (+B[6].adj || 0) + (+B[6].vat || 0) : null;
    var arOpen = E.tbBalance(D.tb, map.receivables, 'opening'), arClose = E.tbBalance(D.tb, map.receivables, 'closing');
    var dAR = arOpen != null && arClose != null ? arClose - arOpen : 0;
    var expectedIn = salesGross == null ? null : salesGross - dAR;
    var receipts = sum.customer_receipt || 0;
    checks.push(check('B1', 'bank', 'Bank customer receipts vs sales declared (incl. VAT, adjusted for receivables)', 'تحصيلات العملاء البنكية مقابل المبيعات المقرة (شاملة الضريبة ومعدلة بالذمم)',
      receipts, 'Bank customer receipts', expectedIn, 'Sales incl. VAT − Δ receivables', S,
      { salesGross: salesGross == null ? null : r2(salesGross), deltaAR: r2(dAR), arMapped: !!map.receivables, note: 'Receipts above declared sales are the classic inspection finding: possible unreported sales.' }));
    // Cash in excess of sales is riskier than the reverse.
    var c1 = checks[0];
    if (c1.status !== 'na' && c1.diff > 0 && c1.status === 'warn') c1.status = 'fail';

    var purGross = B ? (+B[12].amount || 0) + (+B[12].adj || 0) + (+B[12].vat || 0) : null;
    var apOpen = E.tbBalance(D.tb, map.payables, 'opening'), apClose = E.tbBalance(D.tb, map.payables, 'closing');
    var dAP = apOpen != null && apClose != null ? -(apClose - apOpen) : 0; // payables are credit balances
    // reverse-charge VAT (box 9) is self-assessed, never paid to the supplier
    var expectedOut = purGross == null ? null : purGross - dAP - (+B[9].vat || 0);
    var payments = -(sum.supplier_payment || 0) - (sum.foreign_transfer || 0);
    checks.push(check('B2', 'bank', 'Bank supplier payments vs purchases declared (incl. VAT, adjusted for payables)', 'مدفوعات الموردين البنكية مقابل المشتريات المقرة',
      payments, 'Bank supplier + foreign payments', expectedOut, 'Purchases incl. VAT (excl. box 9) − Δ payables', S,
      { purGross: purGross == null ? null : r2(purGross), deltaAP: r2(dAP), apMapped: !!map.payables }));

    // VAT paid this period should equal the previous period's net VAT due.
    var vatPaid = -(sum.zatca_vat || 0);
    var prevDue = ctx.prevNetVat;
    checks.push(check('B3', 'bank', 'VAT paid to ZATCA vs previous return net VAT due', 'الضريبة المسددة للهيئة مقابل صافي الإقرار السابق',
      lines.some(function (l) { return l.cls === 'zatca_vat'; }) ? vatPaid : (prevDue != null ? 0 : null), 'Bank ZATCA VAT payments', prevDue == null ? null : Math.max(prevDue, 0), 'Previous period box 16', S));

    var whtPaid = -(sum.zatca_wht || 0);
    checks.push(check('B4', 'bank', 'WHT paid to ZATCA vs previous WHT return', 'ضريبة الاستقطاع المسددة مقابل إقرار الاستقطاع السابق',
      lines.some(function (l) { return l.cls === 'zatca_wht'; }) ? whtPaid : (ctx.prevWhtTax != null ? 0 : null), 'Bank ZATCA WHT payments', ctx.prevWhtTax == null ? null : ctx.prevWhtTax, 'Previous WHT return tax', S));

    // Foreign transfers with no WHT register line for the same beneficiary/amount.
    var reg = D.wht_reg || [];
    var foreign = lines.filter(function (l) { return l.cls === 'foreign_transfer'; });
    var unmatchedForeign = foreign.filter(function (l) {
      var amt = +l.debit || 0, d = String(l.description || '').toLowerCase();
      return !reg.some(function (w) {
        var net = (+w.gross || 0) - (+w.wht || 0);
        var nameHit = w.party && d.indexOf(String(w.party).toLowerCase().slice(0, 6)) >= 0;
        return Math.abs(net - amt) <= Math.max(1, amt * 0.01) || Math.abs((+w.gross || 0) - amt) <= Math.max(1, amt * 0.01) || nameHit;
      });
    });
    var c5 = { id: 'B5', group: 'bank', title: 'Foreign transfers covered by the WHT register', titleAr: 'التحويلات الخارجية مغطاة في سجل الاستقطاع',
      a: r2(foreign.reduce(function (s, l) { return s + (+l.debit || 0); }, 0)), aLabel: 'Foreign transfers',
      b: r2(unmatchedForeign.reduce(function (s, l) { return s + (+l.debit || 0); }, 0)), bLabel: 'Not in WHT register',
      exceptions: { unmatched: unmatchedForeign.slice(0, 300) }, counts: { unmatched: unmatchedForeign.length } };
    c5.diff = c5.b;
    c5.status = !foreign.length ? 'pass' : unmatchedForeign.length ? 'fail' : 'pass';
    c5.exposure = r2(c5.b * 0.15); // worst-case rate for an unknown payment type
    checks.push(c5);

    // Large customer receipts that match no sales invoice by amount or number.
    var sales = (D.sys_vat || []).filter(function (x) { return x.flow === 'S'; });
    var unmatchedIn = [];
    if (sales.length) {
      var byTotal = {};
      sales.forEach(function (x) { var k = Math.round(+x.total || 0); (byTotal[k] = byTotal[k] || []).push(x); });
      lines.filter(function (l) { return l.cls === 'customer_receipt'; }).forEach(function (l) {
        var amt = +l.credit || 0, k = Math.round(amt), d = String(l.description || '') + ' ' + String(l.reference || '');
        var hit = (byTotal[k] || byTotal[k - 1] || byTotal[k + 1]) || sales.some(function (x) { return x.invoice && d.indexOf(x.invoice) >= 0; });
        if (!hit && amt >= (S.materiality || 0) * 0.1) unmatchedIn.push(l);
      });
    }
    unmatchedIn.sort(function (a, b) { return b.credit - a.credit; });
    var c6 = { id: 'B6', group: 'bank', title: 'Significant receipts traced to sales invoices', titleAr: 'تتبع المقبوضات الجوهرية إلى فواتير المبيعات',
      a: r2(unmatchedIn.reduce(function (s, l) { return s + (+l.credit || 0); }, 0)), aLabel: 'Unmatched receipts', b: 0, bLabel: '',
      exceptions: { unmatched: unmatchedIn.slice(0, 300) }, counts: { unmatched: unmatchedIn.length },
      note: 'Individual receipts (≥ 10% of materiality) that match no invoice total or number. Pooled POS/mada settlements will appear here until classified.' };
    c6.diff = c6.a;
    c6.status = !sales.length ? 'na' : !unmatchedIn.length ? 'pass' : c6.a > S.materiality ? 'fail' : 'warn';
    if (!sales.length) c6.missing = 'System VAT report';
    checks.push(c6);

    // Bank balance per statement vs TB bank accounts.
    if (map.bank && D.bank.some(function (l) { return l.balance; })) {
      var lastBal = 0, byAcc = {};
      D.bank.slice().sort(function (a, b) { return (a.date < b.date ? -1 : a.date > b.date ? 1 : (a._r || 0) - (b._r || 0)); })
        .forEach(function (l) { if (l.balance || l.balance === 0) byAcc[l.account || '_'] = +l.balance || 0; });
      Object.keys(byAcc).forEach(function (k) { lastBal += byAcc[k]; });
      checks.push(check('B7', 'bank', 'Closing bank balance: statements vs TB', 'رصيد البنك الختامي: الكشوف مقابل الميزان', lastBal, 'Statements', E.tbBalance(D.tb, map.bank, 'closing'), 'TB bank accounts', S));
    }
    return { checks: checks, lines: lines, summary: sum };
  };

  // ------------------------------------------------------------------ WHT reconciliation
  E.runWhtRecon = function (ctx) {
    var S = ctx.settings, D = ctx.data, map = (ctx.entity && ctx.entity.mapping) || {}, checks = [];

      { id: 'CT1', title: 'Advance payments of income tax made on time', titleAr: 'سداد الدفعات المعجلة لضريبة الدخل في موعدها', area: 'cit',
        status: !prior ? 'na' : !required ? 'pass' : rows.some(function (r) { return r.state === 'overdue'; }) ? 'fail' : rows.some(function (r) { return r.state === 'late'; }) ? 'warn' : 'pass',
        missing: prior ? '' : 'Last year\'s income tax liability', a: required ? inst : 0, aLabel: 'Each instalment', exposure: r2(owed + fines),
        note: required ? 'Last year\'s tax was SAR ' + prior.toLocaleString('en-US') + ': three instalments of SAR ' + inst.toLocaleString('en-US') + ' are due.' : prior ? 'No advance payments are due: last year\'s tax was under SAR ' + C.advanceThreshold.toLocaleString('en-US') + ' or the instalment under SAR ' + C.minInstalment.toLocaleString('en-US') + '.' : '',
        noteAr: required ? 'كانت ضريبة العام الماضي ' + prior.toLocaleString('en-US') + ' ريال: تستحق ثلاث دفعات معجلة قيمة كل منها ' + inst.toLocaleString('en-US') + ' ريال.' : prior ? 'لا تستحق دفعات معجلة: ضريبة العام الماضي أقل من ' + C.advanceThreshold.toLocaleString('en-US') + ' ريال أو الدفعة أقل من ' + C.minInstalment.toLocaleString('en-US') + ' ريال.' : '' },
      { id: 'CT2', title: 'Income tax return filed within 120 days of the year end', titleAr: 'تقديم إقرار ضريبة الدخل خلال 120 يوماً من نهاية السنة', area: 'cit',
        status: !share ? 'na' : filed ? (filed <= returnDue ? 'pass' : 'warn') : today > returnDue ? 'fail' : 'pass', missing: share ? '' : 'Non-Saudi ownership share',
        a: tax, aLabel: 'Income tax on the non-Saudi share', exposure: !filed && today > returnDue ? r2(tax + lateFine(tax, daysBetween(returnDue, today), C.latePctPer30Days)) : 0,
        note: 'Income tax is ' + Math.round(C.rate * 100) + '% of the taxable profit attributable to non-Saudi owners; the Saudi and GCC share pays Zakat. Return and balance due by ' + returnDue + '.', noteAr: 'ضريبة الدخل ' + Math.round(C.rate * 100) + '% من الربح الخاضع العائد للملاك غير السعوديين، وحصة السعوديين والخليجيين تخضع للزكاة. الإقرار والرصيد مستحقان بحلول ' + returnDue + '.' }
    ];
    return { fyEnd: fyEnd, tax: tax, share: share, prior: prior, instalment: inst, required: required, rows: rows, returnDue: returnDue, fines: r2(fines), owed: r2(owed), checks: checks,
      exposure: r2(checks.reduce(function (s, x) { return s + (x.exposure || 0); }, 0)) };
  };

  // TP. Transfer pricing (TP Bylaws as summarised by advisers): a disclosure form with the
  // return (120 days); master and local files when controlled transactions reach SAR 6m;
  // CbCR notification when the group's revenue exceeds SAR 3.2bn (verify).
  E.tpStatus = function (p, S, today) {
    S = E.mergeSettings(S); today = today || new Date().toISOString().slice(0, 10); p = p || {};
    var T = S.tp, tx = objs(p.transactions), total = r2(tx.reduce(function (s, x) { return s + pos(x.amount); }, 0));
    var fyEnd = E.date(p.fyEnd) || ((+today.slice(0, 4) - 1) + '-12-31'), due = addD(fyEnd, T.dueDays), group = pos(p.groupRevenue);
    var byType = {}; tx.forEach(function (x) { var k = String(x.type || 'other'); byType[k] = r2((byType[k] || 0) + pos(x.amount)); });
    var files = total >= T.fileThreshold, cbcr = group > T.cbcrThreshold, past = today > due;
    var yes = function (v) { return v === true || v === 'yes'; };
    var checks = [
      { id: 'TP1', title: 'Controlled transactions disclosure form filed with the return', titleAr: 'تقديم نموذج الإفصاح عن المعاملات الخاضعة للرقابة مع الإقرار', area: 'tp',
        status: !tx.length ? 'na' : E.date(p.disclosureFiledOn) ? 'pass' : past ? 'fail' : 'warn', missing: tx.length ? '' : 'Related-party transactions for the year', a: total, aLabel: 'Controlled transactions',
        note: 'Due with the Zakat or income tax return, ' + due + ', with a licensed accountant\'s affidavit where required.', noteAr: 'يُقدم مع إقرار الزكاة أو ضريبة الدخل بحلول ' + due + '، مع إقرار محاسب قانوني مرخص عند الحاجة.' },
      { id: 'TP2', title: 'Master file and local file ready', titleAr: 'جاهزية الملف الرئيسي والملف المحلي', area: 'tp',
        status: !tx.length ? 'na' : !files ? 'pass' : yes(p.localFileReady) && yes(p.masterFileReady) ? 'pass' : 'fail', a: total, aLabel: 'Controlled transactions', b: T.fileThreshold, bLabel: 'Threshold',
        note: files ? 'Above SAR ' + T.fileThreshold.toLocaleString('en-US') + ': keep both files ready to hand over within 30 days of a ZATCA request.' : 'Below the SAR ' + T.fileThreshold.toLocaleString('en-US') + ' threshold: the files are not required, the disclosure form still is.', noteAr: files ? 'أعلى من ' + T.fileThreshold.toLocaleString('en-US') + ' ريال: جهّز الملفين لتسليمهما خلال 30 يوماً من طلب الهيئة.' : 'أقل من حد ' + T.fileThreshold.toLocaleString('en-US') + ' ريال: الملفان غير مطلوبين، ونموذج الإفصاح ما زال مطلوباً.' },
      { id: 'TP3', title: 'Country-by-country notification', titleAr: 'إشعار التقرير على مستوى كل دولة', area: 'tp',
        status: !group ? 'na' : !cbcr ? 'pass' : E.date(p.cbcrNotifiedOn) ? 'pass' : past ? 'fail' : 'warn', missing: group ? '' : 'Group consolidated revenue', a: group, aLabel: 'Group revenue', b: T.cbcrThreshold, bLabel: 'Threshold',
        note: cbcr ? 'The group is above SAR ' + T.cbcrThreshold.toLocaleString('en-US') + ': each Saudi entity notifies ZATCA which entity files the report.' : 'The group is below the country-by-country threshold.', noteAr: cbcr ? 'المجموعة أعلى من ' + T.cbcrThreshold.toLocaleString('en-US') + ' ريال: تُبلغ كل منشأة سعودية الهيئة بالمنشأة التي تقدم التقرير.' : 'المجموعة أقل من حد التقرير على مستوى كل دولة.' }
    ];
    return { total: total, byType: byType, filesRequired: files, cbcr: cbcr, due: due, checks: checks };
  };

  // EG. E-invoicing devices (EGS units): each needs a production CSID; an expired one makes
  // every invoice it stamps non-compliant. Units seen in the provider export but missing
  // from the register are devices nobody looks after.
  E.egsStatus = function (devices, seen, S, today) {
    S = E.mergeSettings(S); today = today || new Date().toISOString().slice(0, 10);
    var list = objs(devices).map(function (d) {
      var exp = E.date(d.csidExpiresOn), left = exp ? daysBetween(today, exp) : null, off = d.status === 'retired';
      return { d: d, left: left, state: off ? 'retired' : !exp ? 'unknown' : left < 0 ? 'expired' : left <= S.egs.renewDays ? 'renew' : 'ok' };
    });
    var known = {}; list.forEach(function (x) { known[String(x.d.code || x.d.name || '').trim().toLowerCase()] = 1; });
    var unreg = (Array.isArray(seen) ? seen : []).map(function (u) { return String(u || '').trim(); }).filter(function (u, i, a) { return u && a.indexOf(u) === i && !known[u.toLowerCase()]; });
    var bad = list.filter(function (x) { return x.state === 'expired'; }), soon = list.filter(function (x) { return x.state === 'renew' || x.state === 'unknown'; });
    return { list: list, unregistered: unreg, checks: [
      { id: 'EG1', title: 'Every device has a valid CSID', titleAr: 'لكل جهاز شهادة تشفير سارية', area: 'egs', status: !list.length ? 'na' : bad.length ? 'fail' : soon.length ? 'warn' : 'pass', missing: list.length ? '' : 'E-invoicing devices register',
        a: bad.length, aLabel: 'Expired', note: 'Renew at least ' + S.egs.renewDays + ' days before expiry: renewal needs a new OTP from the Fatoora portal for each unit.', noteAr: 'جدّد قبل الانتهاء بـ ' + S.egs.renewDays + ' يوماً على الأقل: يتطلب التجديد رمزاً جديداً من بوابة فاتورة لكل وحدة.' },
      { id: 'EG2', title: 'Every device that sends invoices is in the register', titleAr: 'كل جهاز يرسل فواتير مسجل في السجل', area: 'egs', status: !seen || !seen.length ? 'na' : unreg.length ? 'fail' : 'pass', missing: seen && seen.length ? '' : 'E-invoicing provider export',
        a: unreg.length, aLabel: 'Devices not in the register', exceptions: { list: unreg.map(function (u) { return { egs: u }; }) } }
    ] };
  };

  // VG. VAT group: one return for all members. The group return must equal the members'
  // figures added up; every member must be a VAT-registered Saudi resident under 50% common control.
  E.vatGroupStatus = function (g, members, S) {
    S = E.mergeSettings(S); g = g || {};
    var periods = Object.keys(g.returns && typeof g.returns === 'object' ? g.returns : {}).sort().reverse();
    var lines = periods.map(function (p) {
      var ret = g.returns[p] || {}, sum = { sales: 0, outputVat: 0, inputVat: 0 }, missing = [];
      objs(members).forEach(function (m) { var x = (m.exercises || []).filter(function (e) { return e.period === p; })[0], sm = x && x.summary; if (!sm) { missing.push(m.name); return; } ['sales', 'outputVat', 'inputVat'].forEach(function (k) { sum[k] += pos(sm[k]); }); });
      var d = { sales: r2(E.num(ret.sales) - sum.sales), outputVat: r2(E.num(ret.outputVat) - sum.outputVat), inputVat: r2(E.num(ret.inputVat) - sum.inputVat) };
      ['sales', 'outputVat', 'inputVat'].forEach(function (k) { if (!isFinite(d[k])) d[k] = 0; sum[k] = r2(sum[k]); });
      var worst = Math.max(Math.abs(d.outputVat), Math.abs(d.inputVat));
      return { period: p, ret: ret, sum: sum, diff: d, missing: missing, status: missing.length ? 'warn' : worst <= S.tolAbs ? 'pass' : 'fail', exposure: r2(Math.max(0, -d.outputVat) + Math.max(0, d.inputVat)) };
    });
    var bad = objs(members).filter(function (m) { return !E.validVatNo(m.trn || '') || m.control === false; });
    return { lines: lines, exposure: r2(lines.reduce(function (s, l) { return s + l.exposure; }, 0)), checks: [
      { id: 'VG1', title: 'Group return equals the members added up', titleAr: 'إقرار المجموعة يساوي مجموع الأعضاء', area: 'group', status: !lines.length ? 'na' : lines.some(function (l) { return l.status === 'fail'; }) ? 'fail' : lines.some(function (l) { return l.status === 'warn'; }) ? 'warn' : 'pass', missing: lines.length ? '' : 'Group return figures' },
      { id: 'VG2', title: 'Every member qualifies for the group', titleAr: 'كل عضو مستوفٍ لشروط المجموعة', area: 'group', status: !objs(members).length ? 'na' : bad.length ? 'fail' : 'pass', a: bad.length, aLabel: 'Members to check',
        note: 'Saudi resident, VAT registered, under 50% common control (ownership, votes or value), not in another group.' }
    ] };
  };

  root.ZEngine = E;
  if (typeof module !== 'undefined' && module.exports) module.exports = E;
})(typeof window !== 'undefined' ? window : this);

<script>
/**
 * Storage backends. Both expose call(action, payload) → Promise of the same
 * response shapes as apps-script/Code.gs.
 *   CloudBackend - the Google Sheets backend, via google.script.run when this
 *                  page is served by Apps Script, or fetch() when hosted
 *                  elsewhere (Content-Type text/plain avoids a CORS preflight).
 *   LocalBackend - IndexedDB in this browser only; for trying the system
 *                  out and for demos. Single user, owner role.
 */
(function (root) {
  'use strict';

  function CloudBackend(url) {
    this.mode = 'cloud';
    this.url = url;
    this.token = null;
    // a remembered session lives in localStorage, a normal one only in this tab
    try { this.token = sessionStorage.getItem('zr_token') || localStorage.getItem('zr_token'); } catch (e) {}
  }
  CloudBackend.prototype.call = function (action, payload) {
    var self = this, req = Object.assign({ action: action, token: this.token }, payload || {});
    var p;
    if (root.google && root.google.script && root.google.script.run) {
      p = new Promise(function (res, rej) {
        root.google.script.run.withSuccessHandler(function (s) { res(JSON.parse(s)); }).withFailureHandler(rej).api(JSON.stringify(req));
      });
    } else {
      p = fetch(this.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req) })
        .then(function (r) { return r.json(); });
    }
    return p.then(function (r) {
      if (r.token) { self.token = r.token; try { if (payload && payload.remember !== undefined) self.remember = !!payload.remember; else if (self.remember === undefined) self.remember = !!localStorage.getItem('zr_token'); (self.remember ? localStorage : sessionStorage).setItem('zr_token', r.token); } catch (e) {} }
      if (!r.ok) { var err = new Error(r.error || 'server_error'); err.code = r.error; throw err; }
      return r;
    });
  };
  CloudBackend.prototype.logout = function () { this.token = null; this.remember = undefined; try { sessionStorage.removeItem('zr_token'); localStorage.removeItem('zr_token'); } catch (e) {} };

  // ---------------------------------------------------------------- local
  var DB = 'zatca-readiness', STORE = 'docs';
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function tx(mode, fn) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, mode), st = t.objectStore(STORE), out = fn(st);
        t.oncomplete = function () { res(out instanceof IDBRequest ? out.result : out); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  function uid(p) { return p + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }

  // Each action reads a whole table and writes it back, so actions run one at
  // a time - two saves in parallel would otherwise lose one of them.
  function LocalBackend() { this.mode = 'local'; this.token = 'local'; this.q = Promise.resolve(); }
  LocalBackend.prototype.all = function (table) {
    return tx('readonly', function (st) { return st.get(table); }).then(function (v) { return v || {}; });
  };
  LocalBackend.prototype.put = function (table, map) { return tx('readwrite', function (st) { st.put(map, table); }); };
  LocalBackend.prototype.audit = function (action, table, id, detail) {
    var self = this;
    // audit entries also read-modify-write one table, so they queue too
    return (self.aq = (self.aq || Promise.resolve()).then(function () { return self.all('audit'); }).then(function (m) {
      var a = { id: uid('A'), at: new Date().toISOString(), user: 'You', action: action, table: table, docId: id, detail: detail || '' };
      m[a.id] = a;
      var keys = Object.keys(m); if (keys.length > 2000) delete m[keys[0]];
      return self.put('audit', m);
    }).catch(function () {}));
  };
  LocalBackend.prototype.call = function (action, p) {
    var self = this, run = function () { return self.run(action, p); };
    var r = this.q.then(run, run);
    this.q = r.catch(function () {});
    return r;
  };
  LocalBackend.prototype.run = function (action, p) {
    var self = this; p = p || {};
    var user = { id: 'local', name: 'You', email: 'local@device', role: 'owner', entityIds: ['*'], active: true };
    var tenant = { id: 'local', name: localStorage.getItem('zr_local_org') || 'My organisation (this device)', plan: 'local', status: 'active' };
    switch (action) {
      case 'me': case 'login': case 'signup':
        if (p.orgName) localStorage.setItem('zr_local_org', p.orgName);
        return Promise.resolve({ ok: true, user: user, tenant: tenant });
      case 'list':
        if (p.table === 'files') return Promise.reject(Object.assign(new Error('forbidden'), { code: 'forbidden' }));
        return self.all(p.table).then(function (m) {
          var docs = Object.keys(m).map(function (k) { return m[k]; }).filter(function (d) { return !p.parentId || d.parentId === p.parentId; });
          if (p.table === 'audit') docs.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
          return { ok: true, docs: docs };
        });
      case 'get':
        return self.all(p.table).then(function (m) { return { ok: true, doc: m[p.id] || null }; });
      case 'save': case 'saveMany':
        var docs = action === 'save' ? [p.doc] : p.docs;
        return self.all(p.table).then(function (m) {
          docs.forEach(function (d) {
            if (!d.id) d.id = uid(p.table.slice(0, 2).toUpperCase());
            if (p.table === 'entities') d.entityId = d.id;
            if (p.table === 'exercises') d.parentId = d.entityId;
            var prev = m[d.id];
            if (p.table === 'exercises' && d.status === 'closed' && (!prev || prev.status !== 'closed')) {
              if ((d.reviews || []).some(function (r) { return r && r.status !== 'cleared'; })) throw Object.assign(new Error('open_review_notes'), { code: 'open_review_notes' });
              d.signedOffBy = user.name; d.signedOffAt = new Date().toISOString();
            }
            d.updatedAt = new Date().toISOString(); d.updatedBy = user.name;
            m[d.id] = d;
          });
          return self.put(p.table, m).then(function () {
            if (p.table !== 'rows') docs.forEach(function (d) { self.audit('save', p.table, d.id, d.name || d.period || d.title || d.label || ''); });
            return action === 'save' ? { ok: true, doc: docs[0] } : { ok: true, docs: docs };
          });
        });
      case 'remove':
        return self.all(p.table).then(function (m) {
          var d = m[p.id]; delete m[p.id];
          var jobs = [self.put(p.table, m)];
          if (p.table === 'exercises') ['datasets', 'rows', 'samples', 'findings', 'checklists'].forEach(function (t) {
            jobs.push(self.all(t).then(function (mm) { Object.keys(mm).forEach(function (k) { if (mm[k].parentId === p.id) delete mm[k]; }); return self.put(t, mm); }));
          });
          if (p.table === 'datasets') jobs.push(self.all('rows').then(function (mm) { delete mm[p.id]; return self.put('rows', mm); }));
          if (p.table === 'attachments') jobs.push(self.all('files').then(function (mm) { delete mm[p.id]; return self.put('files', mm); }));
          return Promise.all(jobs).then(function () { self.audit('delete', p.table, p.id, d ? (d.name || d.period || d.title || '') : ''); return { ok: true }; });
        });
      case 'usersList':
        return self.all('users').then(function (m) { return { ok: true, users: [user].concat(Object.keys(m).map(function (k) { return m[k]; })) }; });
      case 'userSave':
        return self.all('users').then(function (m) {
          var u = Object.assign({}, p.user), email = String(u.email || '').trim().toLowerCase();
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw Object.assign(new Error('bad_email'), { code: 'bad_email' });
          if (email === user.email || Object.keys(m).some(function (k) { return m[k].email === email && m[k].id !== u.id; })) throw Object.assign(new Error('email_taken'), { code: 'email_taken' });
          if (u.id === 'local') throw Object.assign(new Error('cannot_demote_self'), { code: 'cannot_demote_self' });
          var rec = Object.assign(m[u.id] || { id: uid('U'), createdAt: new Date().toISOString() }, { name: String(u.name || email).slice(0, 120), email: email, role: u.role, active: u.active !== false,
            entityIds: !Array.isArray(u.entityIds) ? ['*'] : u.entityIds.indexOf('*') >= 0 ? ['*'] : u.entityIds.slice() });
          m[rec.id] = rec;
          return self.put('users', m).then(function () { self.audit('save', 'users', rec.id, rec.email + ' ' + rec.role); return { ok: true, user: rec }; });
        });
      case 'tenantSave': localStorage.setItem('zr_local_org', p.tenant.name); return Promise.resolve({ ok: true, tenant: Object.assign(tenant, { name: p.tenant.name }) });
      case 'changePassword': case 'platformTenants':
        return Promise.reject(Object.assign(new Error('cloud_only'), { code: 'cloud_only' }));
      default: return Promise.reject(new Error('unknown_action'));
    }
  };
  LocalBackend.prototype.logout = function () {};
  LocalBackend.prototype.wipe = function () { return idb().then(function (db) { db.close(); return new Promise(function (res) { var r = indexedDB.deleteDatabase(DB); r.onsuccess = r.onerror = r.onblocked = function () { res(); }; }); }); };

  root.ZApi = { CloudBackend: CloudBackend, LocalBackend: LocalBackend };
})(typeof window !== 'undefined' ? window : this);

</script>
<script>
/**
 * Demo data: one trading company with a full month of data and the kind of
 * problems a ZATCA inspection finds, planted on purpose so every check has
 * something to show. Deterministic (seeded), so tests can pin the results.
 *
 * Planted issues (period 2026-09):
 *   - return box 1 understates one invoice (SAR 23,400 net)
 *   - Excel workings box 3 differs from the return
 *   - one sales line with VAT ≠ 15%, two invalid customer TRNs, two numbering gaps
 *   - one export with destination SA
 *   - three supplier invoices without a TRN, one duplicate supplier invoice
 *   - a foreign supplier booked as standard-rated instead of RCM
 *   - three sales invoices never reported to Fatoora, one rejected
 *   - a SAR 85,000 cash deposit with no invoice behind it
 *   - a foreign transfer with no WHT register line
 *   - management fees withheld at 15% instead of 20%; one WHT line paid late,
 *     one without a certificate; the WHT return misses one line
 *   - e-invoicing provider: 2 ERP invoices never sent, a POS sale outside the
 *     ERP, a rejected and a pending invoice, an amount mismatch, a B2C invoice
 *     reported after 30 h and a B2B invoice cleared 3.5 h after issue, a skipped
 *     counter, a credit note with no reference, a simplified invoice to a
 *     VAT-registered customer, one accepted with a warning
 *   - Fatoora portal: one standard sale shown as zero-rated, one invoice dated in
 *     October on Fatoora but booked in September, one invoice reported twice,
 *     one invoice to a different buyer TRN than the ERP, one issued under a
 *     group company's VAT number; with the unreported and rejected invoices the
 *     e-invoices hold less VAT than the return declares
 *   - input VAT on a staff dinner, a hotel stay and the GM's car; exempt sales
 *     with no apportionment; SAR 30,000 of gifts against a SAR 4,167 monthly relief
 *   - one export without a customs export declaration (plus the export to SA)
 *   - ZATCA statement of account (Jun-Sep 2026): the August WHT return posted at
 *     SAR 10,340 against 9,840 filed and only 9,840 paid (SAR 500 overdue), a
 *     SAR 2,325 late-payment penalty nobody recorded, so the statement is SAR 2,825
 *     above the GL; the disputed assessment and e-invoicing penalty are booked
 *   - disputes: an assessment under objection, a penalty still to object to (due
 *     in 60 days of notice), one closed with SAR 3,000 relief
 *   - refunds: one waiting on documents ZATCA asked for, one paid SAR 2,550
 *     short, one draft below the SAR 5,000 minimum
 *   - VAT adjustments (as of 2026): the warehouse's taxable use fell to 80% in 2025
 *     once part was let exempt, so SAR 12,000 of input VAT is due back; the 2025 use of
 *     the forklift was never recorded; a SAR 15,000 bad debt qualifies but was not
 *     claimed, and SAR 3,000 was claimed on a 7-month-old debt; a SAR 230,000 advance
 *     was declared a month late (VAT 30,000) with a late invoice; a EUR invoice at 4.05

    var name = function (k) { var w = E.WHT_TYPES.filter(function (x) { return x[0] === k; })[0]; return w ? (S.lang === 'ar' ? w[2] : w[1]) : k; };
    var rows = W.lines.map(function (l) {
      var rate = S.settings.whtRates[l.type];
      return '<tr><td>' + esc(name(l.type)) + ' <span class="faint">' + (rate != null ? Z.r(rate * 100) + '%' : '') + '</span></td><td class="num">' + fmt(l.ret.a) + '</td><td class="num">' + fmt(l.reg.a) + '</td><td class="num bl">' + fmt(l.ret.t) + '</td><td class="num">' + fmt(l.reg.t) + '</td><td class="num">' + fmt(l.xls.t) + '</td><td class="num ' + (l.status === 'fail' ? 'diff-bad' : l.status === 'warn' ? 'diff-warn' : 'faint') + '">' + (Math.abs(l.dRegTax) < 0.005 ? '✓' : fmt(l.dRegTax)) + '</td></tr>';
    }).join('');
    return '<section class="paper area-wht"><header><div><h2>' + t('WHT by payment type') + '</h2><p>' + t('The monthly WHT return against the payments register and the Excel workings. Due by the 10th of the following month; 1% fine per 30 days late.') + '</p></div></header>' +
      (rows ? '<div class="tbl-wrap"><table class="t matrix"><thead><tr><th>' + t('Payment type') + '</th><th class="num">' + t('Return amount') + '</th><th class="num">' + t('Register gross') + '</th><th class="num grp">' + t('Return tax') + '</th><th class="num">' + t('Register WHT') + '</th><th class="num">' + t('Excel tax') + '</th><th class="num">' + t('Return − Register') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">' + t('Load the WHT return and the payments register.') + '</p>') + '</section>' +
      '<section class="paper" style="margin-top:18px"><header><div><h2>' + t('WHT checks') + '</h2></div></header>' + W.checks.map(function (c) { return Z.checkHtml(c, Z.exceptionsHtml(c)); }).join('') + '</section>' +
      '<section class="paper" style="margin-top:18px"><header><div><h2>' + t('Bank trace') + '</h2><p>' + t('Every transfer abroad in the bank statements must be in the WHT register, or have a reason it is not subject to WHT.') + '</p></div></header>' +
      S.R.bank.checks.filter(function (c) { return c.id === 'B5'; }).map(function (c) { return Z.checkHtml(c, Z.exceptionsHtml(c)); }).join('') + '</section>';
  };

  // ---------------------------------------------------------------- analytics
  Z.tabs.analytics = function () {
    var A = S.R.analytics, ra = A.ratios;
    var tiles = '<div class="kpis"><div class="' + (ra.effectiveRate != null && Math.abs(ra.effectiveRate - S.settings.vatRate * 100) >= 0.001 ? 'bad' : '') + '"><b>' + (ra.effectiveRate == null ? '-' : ra.effectiveRate + '%') + '</b><span>' + t('Effective VAT rate on standard sales') + '</span></div>' +
      '<div><b>' + (ra.inputToOutput == null ? '-' : ra.inputToOutput + '%') + '</b><span>' + t('Input VAT as % of output VAT') + '</span></div><div><b>' + (ra.zeroExemptShare == null ? '-' : ra.zeroExemptShare + '%') + '</b><span>' + t('Zero-rated, export and exempt share of sales') + '</span></div>' +
      '<div><b>' + Z.count((S.data.sys_vat || []).length) + '</b><span>' + t('Invoices analysed') + '</span></div></div>';
    var list = A.tests.map(function (x) {
      var extra = x.dist ? benford(x.dist) : x.items.length ? '<details><summary>' + t('Show') + ' ' + Z.count(x.count) + '</summary>' + Z.rowsTable(x.items.slice(0, 200), ['invoice', 'date', 'party', 'vatNo', 'country', 'category', 'net', 'vat', 'reason'].filter(function (c) { return x.items[0][c] !== undefined; })) + '</details>' : '';
      return '<div class="check">' + Z.tick(x.status) + '<div><h3>' + esc(x.id) + ' · ' + esc(Z.tt(x, 'title')) + ' ' + Z.pill(x.severity, t(Z.cap(x.severity))) + '</h3><div class="figs">' + (x.status === 'na' ? '' : '<span>' + t('Items') + ': <b>' + Z.count(x.count) + '</b></span>' + (x.amount ? '<span>' + t('Amount') + ': <b>' + fmt(x.amount) + '</b></span>' : '')) + '</div><p class="faint" style="font-size:12.5px;margin:4px 0 0">' + esc(t(x.desc || '')) + '</p>' + extra + '</div>' +
        '<div class="acts">' + (x.count && !locked() ? '<button class="btn small" data-act="raisea" data-id="' + x.id + '">' + t('Raise finding') + '</button>' : '') + '</div></div>';
    }).join('');
    return tiles + '<section class="paper" style="margin-top:18px"><header><div><h2>' + t('Tests on every invoice') + '</h2><p>' + t('Run over the full system VAT report, not a sample. Flagged items are good candidates for risk-based samples.') + '</p></div></header>' + list + '</section>';
  };
  function benford(dist) {
    var W = 460, H = 150, bw = (W - 30) / 9, max = Math.max.apply(null, dist.map(function (d) { return Math.max(d.actual, d.expected); }));
    var g = dist.map(function (d, i) {
      var x = 20 + i * bw, ha = d.actual / max * (H - 30), he = d.expected / max * (H - 30);
      return '<rect x="' + (x + bw * 0.2) + '" y="' + (H - 18 - ha) + '" width="' + (bw * 0.6) + '" height="' + ha + '" fill="var(--tick)" opacity=".75"><title>' + d.digit + ': ' + d.actual + '% (' + t('expected') + ' ' + d.expected + '%)</title></rect>' +
        '<line x1="' + (x + bw * 0.1) + '" x2="' + (x + bw * 0.9) + '" y1="' + (H - 18 - he) + '" y2="' + (H - 18 - he) + '" stroke="var(--red)" stroke-width="2"/>' +
        '<text x="' + (x + bw / 2) + '" y="' + (H - 4) + '" text-anchor="middle" font-size="11" fill="var(--ink-2)">' + d.digit + '</text>';
    }).join('');
    return '<div class="bench"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + t('First-digit distribution against Benford\'s law') + '">' + g + '</svg><p class="faint" style="font-size:12px">' + t('Bars: actual share. Red lines: Benford expectation.') + '</p></div>';
  }
})();

</script>
<script>
/* Sampling, documents checklist, findings register, the printable inspection
   pack, the Excel export and the demo loader. */
(function () {
  'use strict';
  var E = window.ZEngine, S = Z.S, t = Z.t, esc = Z.esc, fmt = Z.fmt;

  // ---------------------------------------------------------------- sampling
  var POP = { S: 'Sales invoices', P: 'Purchase invoices', W: 'WHT payments' };
  function population(flow) {
    if (flow === 'W') return (S.data.wht_reg || []).map(function (x) { return { ref: x.party + ' ' + x.date, date: x.date, party: x.party, country: x.country, category: x.paymentType, net: x.gross, vat: x.wht, _k: x._k }; });
    return (S.data.sys_vat || []).filter(function (x) { return x.flow === flow; }).map(function (x) { return { ref: x.invoice, date: x.date, party: x.party, vatNo: x.vatNo, country: x.country, category: x.category, docType: x.docType, net: x.net, vat: x.vat, _k: x._k }; });
  }
  function flaggedKeys() {
    var k = {};
    S.R.analytics.tests.forEach(function (x) { if (x.severity !== 'low') x.items.forEach(function (i) { if (i._k) k[i._k] = x.id; }); });
    return k;
  }

  var FLOWS = function () { return Z.isWht() ? ['W'] : ['S', 'P']; };
  var mySamples = function () { return S.samples.filter(function (s) { return FLOWS().indexOf(s.flow) >= 0; }); };
  var myFinding = function (f) { return (f.tax === 'WHT') === Z.isWht(); };
  var myArea = function (a) { return (a === 'WHT') === Z.isWht(); };
  Z.tabs.sampling = function () {
    var lk = Z.locked();
    if (S.sampleId) return sampleDetail(S.samples.filter(function (s) { return s.id === S.sampleId; })[0]);
    var rows = mySamples().map(function (s) {
      var ev = s.eval || E.evaluateSample(s, s.confidence);
      return '<tr class="clickable" data-act="opensample" data-id="' + s.id + '"><td><b>' + esc(t(POP[s.flow])) + '</b><div class="faint">' + esc(t(METHODS[s.method])) + ' · ' + t('seed') + ' ' + s.seed + '</div></td><td class="num">' + s.items.length + '</td><td class="num">' + ev.tested + '</td><td class="num">' + ev.deviations + ' (' + ev.rate + '%)</td><td class="num">' + fmt(ev.actualMisstatement) + '</td><td class="num">' + fmt(ev.projected) + '</td><td>' + (s.conclusion ? Z.pill(s.conclusion === 'accept' ? 'pass' : 'fail', s.conclusion === 'accept' ? t('Population accepted') : t('Not accepted')) : Z.pill('na', t('Testing'))) + '</td></tr>';
    }).join('');
    return '<div class="grid g2" style="align-items:start"><section class="paper"><header><div><h2>' + t('Samples in this exercise') + '</h2><p>' + t('An inspector will ask to see invoices behind the return. Test them first.') + '</p></div></header>' +
      (rows ? '<div class="tbl-wrap"><table class="t"><thead><tr><th>' + t('Population') + '</th><th class="num">' + t('Items') + '</th><th class="num">' + t('Tested') + '</th><th class="num">' + t('Deviations') + '</th><th class="num">' + t('Misstatement') + '</th><th class="num">' + t('Projected') + '</th><th>' + t('Conclusion') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="muted">' + (Z.isWht() ? t('No samples yet. Select WHT payments to test rate, certificate and payment date.') : t('No samples yet. Select one for sales and one for purchases.')) + '</p>') + '</section>' +
      (lk ? '' : newSampleForm()) + '</div>';
  };
  var METHODS = { mus: 'Monetary unit sampling (MUS)', random: 'Simple random', stratified: 'Stratified by value', key: 'Key items above a threshold', risk: 'Risk-based (flagged by analytics)' };

  function newSampleForm() {
    var f = S.sf && FLOWS().indexOf(S.sf.flow) >= 0 ? S.sf : { flow: FLOWS()[0], method: 'mus', confidence: 0.95, tolerable: 0.05, expected: 0, seed: Math.floor(Math.random() * 1e6) };
    S.sf = f;
    var pop = population(f.flow), field = f.flow === 'S' ? 'net' : 'vat';
    var bv = pop.reduce(function (a, x) { return a + Math.abs(+x[field] || 0); }, 0);
    var size;
    // default tolerable misstatement: 3% of book value (performance materiality), never below materiality
    if (f.method === 'mus') { f.tm = f.tm || Math.round(Math.max(S.settings.materiality * (field === 'vat' ? 0.15 : 1), bv * 0.03)); size = E.sampleSizeMUS(bv, f.tm, f.em || 0, f.confidence); }
    else if (f.method === 'key') size = pop.filter(function (x) { return Math.abs(+x[field] || 0) >= (f.threshold || S.settings.materiality); }).length;
    else if (f.method === 'risk') { var fk = flaggedKeys(); size = pop.filter(function (x) { return fk[x._k]; }).length; }
    else size = E.sampleSizeAttribute(f.confidence, f.tolerable, f.expected, pop.length);
    f.size = Math.min(f.sizeOverride || size, pop.length) || size;
    var opt = function (v, cur, l) { return '<option value="' + v + '"' + (String(cur) === String(v) ? ' selected' : '') + '>' + l + '</option>'; };
    return '<section class="paper"><header><div><h2>' + t('Select a new sample') + '</h2><p>' + t('Sizes follow AICPA attribute and MUS tables (Poisson). The seed makes the selection reproducible: anyone re-running it gets the same items.') + '</p></div></header><div class="grid g2">' +
      '<label class="f"><span>' + t('Population') + '</span><select data-chg="sf" data-f="flow">' + FLOWS().map(function (k) { return opt(k, f.flow, t(POP[k])); }).join('') + '</select><small>' + Z.count(pop.length) + ' ' + t('items') + ', ' + t('book value') + ' ' + fmt(bv) + ' (' + (field === 'vat' ? t('VAT / WHT') : t('net')) + ')</small></label>' +
      '<label class="f"><span>' + t('Method') + '</span><select data-chg="sf" data-f="method">' + Object.keys(METHODS).map(function (k) { return opt(k, f.method, t(METHODS[k])); }).join('') + '</select></label>' +
      '<label class="f"><span>' + t('Confidence') + '</span><select data-chg="sf" data-f="confidence">' + [0.9, 0.95, 0.99].map(function (c) { return opt(c, f.confidence, c * 100 + '%'); }).join('') + '</select></label>' +
      (f.method === 'mus' ? Z.fld('tm', t('Tolerable misstatement (SAR)'), f.tm, 'number', 'data-chg="sf" data-f="tm"') + Z.fld('em', t('Expected misstatement (SAR)'), f.em || 0, 'number', 'data-chg="sf" data-f="em"')
        : f.method === 'key' ? Z.fld('threshold', t('Threshold (SAR)'), f.threshold || S.settings.materiality, 'number', 'data-chg="sf" data-f="threshold"')
          : f.method === 'risk' ? '' : Z.fld('tolerable', t('Tolerable deviation rate %'), f.tolerable * 100, 'number', 'step="0.5" data-chg="sf" data-f="tolerable"') + Z.fld('expected', t('Expected deviation rate %'), f.expected * 100, 'number', 'step="0.5" data-chg="sf" data-f="expected"')) +
      Z.fld('seed', t('Random seed'), f.seed, 'number', 'data-chg="sf" data-f="seed"') +
      Z.fld('size', t('Sample size'), f.size == null ? '' : f.size, 'number', 'min="1" data-chg="sf" data-f="size"', f.size == null ? t('Tolerable must exceed expected × expansion factor.') : t('Calculated. You may raise it.')) + '</div>' +
      '<div class="row end" style="margin-top:14px"><button class="btn primary" data-act="makesample"' + (pop.length ? '' : ' disabled') + '>' + t('Select') + ' ' + (f.size || 0) + ' ' + t('items') + '</button></div></section>';
  }
  Z.CHG.sf = function (el) {
    var f = S.sf, k = el.dataset.f, v = el.value;
    if (k === 'flow' || k === 'method') { f[k] = v; f.sizeOverride = null; if (k === 'flow') f.tm = null; }
    else if (k === 'tolerable' || k === 'expected') { f[k] = +v / 100; f.sizeOverride = null; }
    else if (k === 'size') f.sizeOverride = +v;
    else { f[k] = +v; if (k !== 'seed') f.sizeOverride = null; }
    Z.route();
  };
  Z.ACT.makesample = function () {
    var f = S.sf, pop = population(f.flow), field = f.flow === 'S' ? 'net' : 'vat', sel, interval = 0, start = 0;
    if (f.method === 'mus') { var m = E.selectMUS(pop, f.size, f.seed, field); sel = m.items; interval = m.interval; start = m.start; }
    else if (f.method === 'random') sel = E.selectRandom(pop, f.size, f.seed);
    else if (f.method === 'stratified') sel = E.selectStratified(pop, f.size, f.seed, field, 4);
    else if (f.method === 'key') sel = E.selectKey(pop, f.threshold || S.settings.materiality, field);
    else { var fk = flaggedKeys(); sel = pop.map(function (x, i) { return { i: i, why: t('Flagged by') + ' ' + fk[x._k] }; }).filter(function (x) { return fk[pop[x.i]._k]; }); }
    if (!sel.length) return Z.toast(t('Nothing selected. Check the population and parameters.'), true);
    var doc = {
      parentId: S.ex.id, flow: f.flow, method: f.method, confidence: f.confidence, tolerable: f.tolerable, expected: f.expected, tm: f.tm, em: f.em, threshold: f.threshold,
      seed: f.seed, valueField: field, populationCount: pop.length, populationValue: E.r2(pop.reduce(function (a, x) { return a + Math.abs(+x[field] || 0); }, 0)),
      interval: interval, start: start, label: POP[f.flow] + ' ' + f.method, createdAt: new Date().toISOString(),
      items: sel.map(function (s) { var x = pop[s.i]; return Object.assign({}, x, { book: E.r2(Math.abs(+x[field] || 0)), why: s.why, tests: {}, audited: '', evidence: '', note: '' }); })
    };
    Z.save('samples', doc).then(function (d) { S.samples.push(d); S.sampleId = d.id; S.sf = null; Z.changed(); });
  };
  Z.ACT.opensample = function (el) { S.sampleId = el.dataset.id; Z.route(); };
  Z.ACT.closesample = function () { S.sampleId = null; Z.route(); };

  function sampleDetail(s) {
    if (!s) { S.sampleId = null; return Z.tabs.sampling(); }
    var A = E.ATTRIBUTES[s.flow], ev = E.evaluateSample(s, s.confidence), lk = Z.locked();
    var head = '<tr><th>#</th><th>' + t('Item') + '</th><th class="num">' + t('Book') + '</th>' + A.map(function (a, i) { return '<th title="' + esc(S.lang === 'ar' ? a[2] : a[1]) + '" style="text-align:center">' + (i + 1) + '</th>'; }).join('') + '<th class="num">' + t('Audited value') + '</th><th>' + t('Evidence / note') + '</th></tr>';
    var rows = s.items.map(function (x, i) {
      var bad = Object.keys(x.tests).some(function (k) { return x.tests[k] === 'fail'; });
      return '<tr' + (bad ? ' class="bad"' : '') + '><td class="faint">' + (i + 1) + '</td><td><b>' + esc(x.ref) + '</b><div class="faint" style="font-size:12px">' + esc([x.date, x.party, x.category].filter(Boolean).join(' · ')) + '</div><div class="faint" style="font-size:11.5px">' + esc(x.why) + '</div></td><td class="num">' + fmt(x.book) + '</td>' +
        A.map(function (a) { var v = x.tests[a[0]] || ''; return '<td style="text-align:center"><button class="attr ' + v + '" data-act="attr" data-i="' + i + '" data-a="' + a[0] + '"' + (lk ? ' disabled' : '') + ' aria-label="' + esc(a[1] + ': ' + (v || 'not tested')) + '">' + ({ pass: '✓', fail: '✕', na: '-' }[v] || '') + '</button></td>'; }).join('') +
        '<td style="width:120px"><input type="number" step="0.01" value="' + esc(x.audited) + '" data-chg="sitem" data-i="' + i + '" data-f="audited" placeholder="' + fmt(x.book) + '"' + (lk ? ' disabled' : '') + '></td><td style="min-width:180px"><input type="text" value="' + esc(x.evidence) + '" data-chg="sitem" data-i="' + i + '" data-f="evidence" placeholder="' + esc(t('Drive link or file ref')) + '"' + (lk ? ' disabled' : '') + '></td></tr>';
    }).join('');
    var legend = A.map(function (a, i) { return '<li><b>' + (i + 1) + '</b> ' + esc(S.lang === 'ar' ? a[2] : a[1]) + ' <span class="faint">(' + (ev.byAttr[i].fails) + '/' + ev.byAttr[i].tested + ')</span></li>'; }).join('');
    return '<div class="spread" style="margin-bottom:14px"><button class="btn small" data-act="closesample">‹ ' + t('All samples') + '</button><div class="row">' + (lk ? '' : '<button class="btn small" data-act="passall">' + t('Mark untested as passed') + '</button><button class="btn small danger" data-act="delsample">' + t('Delete sample') + '</button>') + '<button class="btn small" data-act="xlsample">' + t('Export to Excel') + '</button></div></div>' +
      '<div class="grid g2" style="align-items:start"><section class="paper"><header><div><h2>' + esc(t(POP[s.flow])) + ' - ' + esc(t(METHODS[s.method])) + '</h2><p>' + t('Seed') + ' ' + s.seed + ' · ' + t('population') + ' ' + Z.count(s.populationCount) + ' / ' + fmt(s.populationValue) + (s.interval ? ' · ' + t('interval') + ' ' + fmt(s.interval) + ' · ' + t('start') + ' ' + fmt(s.start) : '') + '</p></div></header>' +
      '<div class="kpis"><div><b>' + ev.tested + ' / ' + ev.total + '</b><span>' + t('Items tested') + '</span></div><div class="' + (ev.deviations ? 'bad' : '') + '"><b>' + ev.rate + '%</b><span>' + t('Deviation rate') + ' (' + t('upper limit') + ' ' + (ev.upperRate == null ? '-' : ev.upperRate + '%') + ')</span></div>' +
      '<div class="' + (ev.actualMisstatement ? 'bad' : '') + '"><b>' + fmt(ev.actualMisstatement) + '</b><span>' + t('Misstatement found') + '</span></div><div><b>' + fmt(ev.projected) + '</b><span>' + t('Projected to population') + (ev.upperLimit != null ? ' · ' + t('upper limit') + ' ' + fmt(ev.upperLimit) : '') + '</span></div></div>' +
      '<div class="grid g2" style="margin-top:14px"><label class="f"><span>' + t('Conclusion') + '</span><select data-chg="sconcl"' + (lk ? ' disabled' : '') + '><option value="">' + t('Still testing') + '</option><option value="accept"' + (s.conclusion === 'accept' ? ' selected' : '') + '>' + t('Population accepted') + '</option><option value="reject"' + (s.conclusion === 'reject' ? ' selected' : '') + '>' + t('Not accepted - extend testing or correct') + '</option></select></label>' +
      '<label class="f"><span>' + t('Reviewer note') + '</span><input type="text" value="' + esc(s.note || '') + '" data-chg="snote"' + (lk ? ' disabled' : '') + '></label></div></section>' +
      '<section class="paper"><h3>' + t('Attributes tested') + '</h3><p class="faint" style="font-size:12.5px">' + t('Click a cell: blank → ✓ passed → ✕ failed → - not applicable.') + '</p><ol style="padding-inline-start:0;list-style:none;font-size:13px;display:grid;gap:4px">' + legend + '</ol></section></div>' +
      '<section class="paper flush" style="margin-top:18px"><div class="tbl-wrap"><table class="t">' + head + '<tbody>' + rows + '</tbody></table></div></section>';
  }
  function curSample() { return S.samples.filter(function (s) { return s.id === S.sampleId; })[0]; }
  var saveT;
  function saveSample(s, rerender) {
    clearTimeout(saveT);
    saveT = setTimeout(function () { var c = Object.assign({}, s); delete c.eval; Z.save('samples', c); Z.recompute(); Z.saveSummary(); }, 600);
    if (rerender) Z.route();
  }
  Z.ACT.attr = function (el) {
    var s = curSample(), x = s.items[+el.dataset.i], a = el.dataset.a, nx = { '': 'pass', pass: 'fail', fail: 'na', na: '' }[x.tests[a] || ''];
    if (nx) x.tests[a] = nx; else delete x.tests[a];
    el.className = 'attr ' + nx; el.textContent = { pass: '✓', fail: '✕', na: '-' }[nx] || '';
    el.closest('tr').classList.toggle('bad', Object.keys(x.tests).some(function (k) { return x.tests[k] === 'fail'; }));
    saveSample(s);
  };
  Z.ACT.passall = function () {
    var s = curSample();
    s.items.forEach(function (x) { E.ATTRIBUTES[s.flow].forEach(function (a) { if (!x.tests[a[0]]) x.tests[a[0]] = 'pass'; }); });
    saveSample(s, true);
  };
  Z.CHG.sitem = function (el) { var s = curSample(); s.items[+el.dataset.i][el.dataset.f] = el.value; saveSample(s); };
  Z.CHG.sconcl = function (el) { var s = curSample(); s.conclusion = el.value; saveSample(s, true); };
  Z.CHG.snote = function (el) { var s = curSample(); s.note = el.value; saveSample(s); };
  Z.ACT.delsample = function () {
    if (!confirm(t('Delete this sample and its test results?'))) return;
    Z.call('remove', { table: 'samples', id: S.sampleId }).then(function () { S.samples = S.samples.filter(function (s) { return s.id !== S.sampleId; }); S.sampleId = null; Z.changed(); });
  };
  Z.ACT.xlsample = function () {
    var s = curSample(), A = E.ATTRIBUTES[s.flow];
